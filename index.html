<title>Corner Men</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Layout: one fixed phone screen — HUD, gym window, switchable panel, bottom menu. Nothing scrolls the page. */
:root{
  --bg:#17130f; --panel:#231c16; --panel2:#2e251d; --line:#463a2d;
  --fg:#f1e5d0; --muted:#a8957d; --red:#d4452f; --gold:#e8b13a; --blue:#5b8fc4; --green:#74b35d;
  --f-display:'Press Start 2P', ui-monospace, monospace;
  --f-body:'Pixelify Sans', system-ui, sans-serif;
  --f-mono:'VT323', ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.3;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px 0}
h2,h3{font-family:var(--f-display);font-weight:400;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:11px;line-height:1.6}
h3{font-size:8px;color:var(--muted);letter-spacing:.1em}
p{margin:0}
.hud{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:5px;flex:none}
.hud div{background:var(--panel);border:2px solid var(--line);padding:4px 6px;min-width:0}
.hud small{display:block;font-family:var(--f-display);font-size:6px;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
.hud b{font-family:var(--f-mono);font-size:20px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.screen{position:relative;border:3px solid #0b0907;outline:2px solid var(--line);background:#000;line-height:0;flex:none}
canvas.px{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.tagl{position:absolute;left:5px;top:5px;line-height:1;font-family:var(--f-display);font-size:7px;background:rgba(0,0,0,.65);color:var(--fg);padding:4px 5px}
.dayover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;gap:6px;line-height:1;pointer-events:none}
.dayover b{font-family:var(--f-display);font-size:11px;background:rgba(0,0,0,.7);padding:6px 8px;color:var(--gold);font-weight:400}
.skip{position:absolute;right:5px;bottom:5px;line-height:1}
.panel{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.scrolly{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:6px}
.nav{flex:none;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;gap:4px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.nav button{background:var(--panel);border:2px solid var(--line);color:var(--muted);font-family:var(--f-display);font-size:7px;padding:12px 2px 10px;cursor:pointer;line-height:1.4;position:relative}
.nav button.on{color:var(--fg);border-color:var(--gold);background:var(--panel2)}
.nav button.go{background:var(--gold);color:#1b140c;border-color:#9c7420;border-bottom-width:4px}
.nav button.go:disabled{opacity:.5}
.nav button.go.fightgo{background:var(--red);border-color:#8f2a1b;color:#fff}
.badge{position:absolute;top:-6px;right:-3px;background:var(--red);color:#fff;font-size:7px;padding:3px 4px;font-family:var(--f-display)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;flex:none}
.seg button{background:var(--panel);border:2px solid var(--line);color:var(--muted);padding:6px 4px;font-family:var(--f-body);font-size:13px;cursor:pointer;min-width:0;line-height:1.2}
.seg button b{display:block;font-family:var(--f-display);font-size:6px;letter-spacing:.08em;margin-bottom:2px;font-weight:400}
.seg button.on{background:var(--panel2);color:var(--fg);border-color:var(--gold)}
.seg button:disabled{opacity:.45}
.card{background:var(--panel);border:2px solid var(--line);padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.who{display:flex;gap:10px;align-items:center}
.who canvas{width:48px;height:48px;image-rendering:pixelated;border:2px solid var(--line);background:#3a2d22;flex:none}
.nm{font-family:var(--f-display);font-size:9px;line-height:1.5}
.nm em{font-style:normal;color:var(--gold)}
.meta{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:2px solid var(--line);padding:1px 5px;font-size:12px;background:var(--panel2)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chip.lock{opacity:.5}
.stats{display:grid;gap:3px}
.stat{display:grid;grid-template-columns:78px 1fr 26px;gap:7px;align-items:center;font-size:13px}
.bar{height:8px;background:#120e0b;border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.bar.red i{background:var(--red)} .bar.gold i{background:var(--gold)} .bar.blue i{background:var(--blue)} .bar.green i{background:var(--green)}
.num{font-family:var(--f-mono);font-size:18px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.warn{color:var(--red);font-size:13px}
.good{color:var(--green)}
.btn{background:var(--panel2);color:var(--fg);border:2px solid var(--line);border-bottom-width:4px;font-family:var(--f-display);font-size:8px;padding:10px 6px 8px;cursor:pointer;line-height:1.5;text-align:center}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.red{background:var(--red);border-color:#8f2a1b;color:#fff}
.btn.gold{background:var(--gold);border-color:#9c7420;color:#1b140c}
.btn.big{font-size:10px;padding:14px 8px 12px;width:100%}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:8px 10px;cursor:pointer;color:var(--fg);text-align:left;font-family:var(--f-body);font-size:14px}
.slot .n{font-family:var(--f-display);font-size:10px;color:var(--gold)}
.slot strong{display:block;font-family:var(--f-display);font-size:8px;font-weight:400;margin-bottom:3px;line-height:1.5}
.slot span.meta{font-size:12px}
.slot em{font-style:normal;font-family:var(--f-display);font-size:7px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:5px}
.r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:6px 8px;min-width:0}
.r strong{font-family:var(--f-display);font-size:7px;font-weight:400;line-height:1.6;display:block}
.r p{font-size:12px;color:var(--muted)}
.r .btn{font-size:7px;padding:8px 6px 6px;white-space:nowrap}
.log{background:#0f0c09;border:2px solid var(--line);padding:6px 8px;font-family:var(--f-mono);font-size:17px;line-height:1.05;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;flex:1}
.log span:first-child{color:var(--fg)}
.log b{color:var(--gold);font-weight:400}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.kv div{background:var(--panel);border:2px solid var(--line);padding:5px 7px}
.kv small{display:block;font-family:var(--f-display);font-size:6px;color:var(--muted);letter-spacing:.08em;margin-bottom:3px}
.kv b{font-family:var(--f-mono);font-size:19px;font-weight:400;line-height:1}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}
.tag{font-size:11px;padding:0 5px;border:2px solid var(--line)}
.tag.g{color:var(--green);border-color:var(--green)} .tag.b{color:var(--red);border-color:var(--red)} .tag.m{color:var(--gold);border-color:var(--gold)}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(8,6,4,.8);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:max(10px,env(safe-area-inset-top,0px))}
.sheet{background:var(--panel);border:3px solid var(--line);border-bottom:none;width:100%;max-width:540px;max-height:100%;overflow:auto;
  padding:14px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;animation:up .16s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.hint{color:var(--muted);font-size:14px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pick button{background:var(--panel2);border:2px solid var(--line);color:var(--fg);padding:8px 5px;cursor:pointer;text-align:left;font-family:var(--f-body);font-size:12px;line-height:1.2;min-height:62px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pick button strong{font-family:var(--f-display);font-size:7px;font-weight:400;line-height:1.5}
.pick button span{color:var(--muted)}
.pick button.on{border-color:var(--gold)}
.pick button:disabled{opacity:.4}
.lossw{color:var(--gold)} .lossr{color:var(--red)} .mini small .lossw,.mini small .lossr{font-size:9px}
.plancard{gap:3px;padding:7px 9px;font-size:12px;overflow:auto;min-height:0} .plancard .meta,.plancard .warn{font-size:12px;line-height:1.3}
.planbox{grid-template-columns:1fr auto!important;padding:9px 10px!important}
.planbox .pl{display:block;font-size:14px;color:var(--fg);margin-top:2px}
.planbox em.ed{font-style:normal;font-family:var(--f-display);font-size:7px;color:#1b140c;background:var(--gold);padding:7px 8px;line-height:1.5;text-align:center}
.plan3{grid-template-columns:repeat(3,1fr)}
.plan3 .slot{grid-template-columns:1fr;gap:3px;padding:6px 7px;align-content:start;min-width:0}
.plan3 .slot .n{font-size:6px;color:var(--muted)}
.plan3 .slot strong{margin:0}
.plan3 .slot span.meta{font-size:11px;line-height:1.25}
.panel .card .btn.keep{padding:6px;font-size:7px}
.seg .wk{font-size:10px;opacity:.85}
.seg.sub2 button{padding:4px;font-family:var(--f-display);font-size:7px;letter-spacing:.06em}
.txt{width:100%;background:var(--panel2);border:2px solid var(--line);color:var(--fg);font-family:var(--f-body);font-size:16px;padding:8px}
.txt:focus{outline:none;border-color:var(--gold)}
.logos{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.logos button{background:var(--panel2);border:2px solid var(--line);color:var(--muted);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--f-display);font-size:7px;cursor:pointer}
.logos button.on{border-color:var(--gold);color:var(--fg)}
.tagl img{margin:-2px 2px 0 0}
.snd{position:absolute;right:5px;top:5px;z-index:3;background:rgba(0,0,0,.65);color:var(--fg);border:1px solid rgba(255,255,255,.2);font-family:var(--f-display);font-size:7px;line-height:1;padding:5px 6px;cursor:pointer}
.stage .snd{top:auto;bottom:5px;right:5px}
.stys{display:flex;flex-direction:column;gap:4px}
.sty{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);padding:4px 6px;font-size:12px}
.sty.on{border-color:var(--gold)}
.sty b{font-family:var(--f-display);font-size:7px;font-weight:400}
.pips{display:flex;gap:2px;margin:2px 0}.pips i{width:12px;height:5px;background:#3a2d22;border:1px solid #5a4632}.pips i.f{background:var(--gold);border-color:var(--gold)}.pips i.x{opacity:.25}
.menu{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center;padding:6px 0}
.menu .mtitle{font-family:var(--f-display);font-size:22px;color:var(--gold);letter-spacing:.06em;text-shadow:3px 3px 0 #8f2a1b;margin:6px 0 2px}
.menu .mlogo{display:flex;justify-content:center;margin-bottom:6px}
.menu .btn small{display:block;font-family:var(--f-body);font-size:12px;letter-spacing:0;margin-top:4px;opacity:.85}
.snd{font-size:9px!important;padding:5px 7px!important}
.rdot{position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--red);border-radius:50%}
.sumr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:6px 8px}
.fatbox{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;background:var(--panel2);border:2px solid var(--line);padding:6px 8px}
.fatbox .fl{display:flex;flex-direction:column;gap:3px}
.fatbox small{font-family:var(--f-display);font-size:6px;color:var(--muted);letter-spacing:.06em}
.fatbox b{font-family:var(--f-mono);font-size:20px;font-weight:400;line-height:1}
.fatbox p{grid-column:1/-1;font-size:12px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mini div{background:var(--panel2);border:2px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mini small{font-family:var(--f-display);font-size:6px;color:var(--muted);letter-spacing:.06em}
.mini b{font-family:var(--f-mono);font-size:20px;font-weight:400;line-height:1}
.mini .low{border-color:var(--red)} .mini .low small{color:var(--red)}
.pick button em{font-style:normal;color:var(--gold);font-size:12px}
.rep{display:flex;flex-direction:column;gap:6px}
.rep .r{grid-template-columns:1fr}
.rep .r p{color:var(--fg);font-size:13px}
.stars{color:var(--gold);letter-spacing:1px}
.talent canvas{width:84px;height:84px;image-rendering:pixelated;border:2px solid var(--line);background:#3a2d22;align-self:center}
.quote{font-size:14px;color:var(--muted);text-align:center;font-style:italic}

/* fight */
.fight{position:fixed;inset:0;z-index:70;background:#0c0a08;display:flex;flex-direction:column;gap:6px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.fight>*{max-width:520px;width:100%;margin:0 auto}
.fight .bar i.v{transition:width .7s ease}
.fight .bar i.pv{position:absolute;top:0;bottom:0;width:0}
.fight .bar.gold i.pv{background:rgba(255,236,170,.65)} .fight .bar.red i.pv{background:rgba(255,170,150,.65)}
.fight .fside.rt .bar i.pv{display:none}
.fhead{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;flex:none}
.fside{display:flex;flex-direction:column;gap:3px;min-width:0}
.fside.rt{text-align:right}
.fside.rt .bar i{left:auto;right:0}
.fname{font-family:var(--f-display);font-size:7px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fclock{text-align:center;font-family:var(--f-display);font-size:7px;color:var(--muted);line-height:1.8}
.fclock b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:400;color:var(--fg);line-height:1}
.booth{display:grid;grid-template-columns:1fr 74px;gap:6px;flex:none;height:64px;min-height:0}
.booth.big{flex:1;height:auto;grid-template-columns:1fr 34%}
.fcom{background:#0f0c09;border:2px solid var(--line);padding:5px 8px;font-family:var(--f-mono);font-size:18px;line-height:1.05;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;overflow:hidden;min-height:0}
.booth.big .fcom{font-size:18px;gap:5px;padding:8px 10px}
.caster{background:#1a1410;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;min-height:0;overflow:hidden}
.caster canvas{width:100%;height:auto;max-height:100%;image-rendering:pixelated;min-height:0}
.caster span{font-family:var(--f-display);font-size:6px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.booth:not(.big) .caster span{display:none}
.fcom div{opacity:.55} .fcom div:last-child{opacity:1}
.fcom .sys{color:var(--gold)} .fcom .me{color:#ff9a86} .fcom .ok{color:#8fe07a} .fcom .half{color:#f2c94c} .fcom .bad{color:#ff6b5a} .fcom .info{color:#9cc4ec}
.stagew{display:flex;justify-content:center;flex:none}
.stage{position:relative;line-height:0;border:3px solid #0b0907;outline:2px solid var(--line);border-radius:4px;overflow:hidden}
.fight canvas.px{height:min(54vh,calc(min(100vw,520px) - 26px));width:auto;max-width:100%;display:block;transition:height .25s}
.fight.compact canvas.px{height:min(34vh,calc(min(100vw,520px) - 26px))}
.stage .fhead{position:absolute;left:6%;right:6%;top:4%;background:rgba(10,8,6,.82);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 8px;line-height:1.3}
.stage .fclock b{font-size:22px}
.tks{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tks button{background:var(--panel2);border:2px solid var(--line);color:var(--fg);padding:7px 7px 6px;text-align:left;font-family:var(--f-body);font-size:12px;line-height:1.2;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.tks button strong{font-family:var(--f-display);font-size:7px;font-weight:400;line-height:1.5}
.tks button span{color:var(--muted)}
.verdict{border:3px solid;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.verdict b{font-family:var(--f-display);font-size:11px;font-weight:400}
.verdict.ok{border-color:#5fbf4a;background:rgba(95,191,74,.12)} .verdict.ok b{color:#8fe07a}
.verdict.half{border-color:#e0b23a;background:rgba(224,178,58,.12)} .verdict.half b{color:#f2c94c}
.verdict.bad{border-color:#d4452f;background:rgba(212,69,47,.12)} .verdict.bad b{color:#ff6b5a}
.verdict.info{border-color:#5b8fc4;background:rgba(91,143,196,.12)} .verdict.info b{color:#9cc4ec}
.fctl{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
.sum{display:grid;grid-template-columns:1fr 54px 54px;gap:1px 8px;font-size:12px;background:var(--panel);border:2px solid var(--line);padding:6px 8px}
.sum b{font-family:var(--f-display);font-size:6px;color:var(--muted);font-weight:400;letter-spacing:.08em;text-align:right}
.sum b:first-child{text-align:left}
.sum span.v{font-family:var(--f-mono);font-size:16px;text-align:right;line-height:1}
.sum small{font-size:12px;color:var(--muted)}
.sum .me{color:#ff9a86} .sum .op{color:#9cc4ec}
.cseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cseg2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.cseg .btn,.cseg2 .btn{font-size:7px;padding:9px 3px 7px}
.cseg .btn.on,.cseg2 .btn.on{background:var(--gold);color:#1b140c;border-color:#9c7420}
</style>

<div id="app">
  <div class="hud" id="hud"></div>
  <div class="screen" id="gymScreen"><canvas class="px" id="gym" width="240" height="136"></canvas><div class="tagl" id="tagl"></div><button class="snd" id="pauseBtn" aria-label="Pausa">II</button></div>
  <div class="panel" id="panel"></div>
  <div class="nav" id="nav"></div>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));

function addStyleXP(a,st,pts,up,coach){
  if(styleLv(a,st)<1&&!coach)return;

  a.sxp[st]=(a.sxp[st]||0)+pts;
  while(a.sty[st]<cap&&a.sxp[st]>=SXP(a.sty[st])){a.sxp[st]-=SXP(a.sty[st]);a.sty[st]++;up&&up.push(`${st} nv ${a.sty[st]}`)}

}

  const bd=rollBody(a.cat);const st=styleForBody(bodyType({cat:a.cat,...bd}));
  const used=S.roster.map(x=>x.nick);const o={name:pick(FIRST)+' '+pick(LAST),nick:pick(NICKS.filter(n=>!used.includes(n))),academy:rv.n,style:st,look:{...look(),trunk:pick(TRUNKS.filter(c=>c!==a.look.trunk))},attrs:{},
    skills:{jab:1+Math.floor(r/25),direto:r>22?1+Math.floor(r/30):0,gancho:r>34?1+Math.floor(r/40):0,uppercut:r>28?1+Math.floor(r/38):0,corpoDireto:r>30?1+Math.floor(r/45):0,figado:r>40?1+Math.floor(r/50):0,contra:r>30?Math.min(5,1+Math.floor((r-30)/12)):0},def:{bloqueio:1+Math.floor(r/30),esquiva:r>26?1+Math.floor(r/40):0,clinch:r>22?1+Math.floor(r/45):0},rating:0,trait:pick(Object.keys(TRAITS))};
  for(const[k]of ATTRS)o.attrs[k]=clamp(r+RI(-7,7),5,99);
  if(st==='In-fighter')o.attrs.forca+=4;if(st==='Outboxer')o.attrs.defesa+=4;if(st==='Puncher')o.attrs.forca+=4;
  o.rating=rating(o);o.made=S.week;o.cat=a.cat;o.gift=rollGift(a.cat);o.h=bd.h;o.r=bd.r;initBody(o,clamp(a.tier+1+RI(0,1)+(title?1:0),1,5));
  if(a.tier>=2){const others=shuffle(STYLES.filter(x=>x!==o.style));others.slice(0,a.tier>=3?2:1).forEach(x=>{o.sty[x]=Math.min(styleCap(o,x),Math.max(1,o.sty[o.style]-RI(0,1)))})}

function scoutOf(o){
  if(!o.rec){const n=RI(0,4);o.rec={w:Math.round(n*.6),l:n-Math.round(n*.6),ko:0}}
  if(!o.made)o.made=S.week;
  if(!o.scout){
    const n=o.rec.w+o.rec.l;let u=n<=2?12:n<=5?8:n<=10?5:3;
    const sc={u,attrs:{}};
    for(const[k]of ATTRS){const c=o.attrs[k]+R(-u*.6,u*.6);sc.attrs[k]=[Math.max(1,Math.round(c-u)),Math.round(c+u)]}
    const seen=n<=2?1:n<=5?2:4;sc.skills=Object.keys(o.skills).filter(k=>o.skills[k]>0).slice(0,seen);
    o.scout=sc;
  }
  const u=Math.max(2,o.scout.u-(S.up.treinador?2:0));
  return{...o.scout,u};
}
function scoutRating(o){const sc=scoutOf(o);return ATTRS.reduce((t,[k])=>t+(sc.attrs[k][0]+sc.attrs[k][1])/2,0)/5+Object.values(o.skills).reduce((t,v)=>t+(v||0),0)*1.5}

function addOffer(a,easy){
  if(a.offers.length>=3)return;
  const t=TIERS[a.tier];
  const title=!easy&&a.rank<=3&&!a.offers.some(x=>x.title);
  const opp=makeOpp(a,title);
  if(easy){for(const[k]of ATTRS)opp.attrs[k]=clamp(a.attrs[k]+RI(-3,3),5,99);opp.rating=rating(opp)}
  const purse=RI(t.purse[0],t.purse[1])*(title?2:1);
  a.offers.push({id:'o'+Date.now()+RI(0,999),opp,purse:Math.round(purse/10)*10,inWeeks:RI(6,8),expires:S.week+2,title,rounds:t.rounds+(title?1:0)});
}

function anyFightNow(){return S.roster.some(a=>a.fight&&a.fight.week===S.week)}
function fightLine(a){

  return `<div class="meta">${a.fight.title?'<b class="warn">TÍTULO</b> · ':''}Luta vs <b>${a.fight.opp.nick}</b> · <b class="${w<=0?'warn':''}" style="${w>0?'color:var(--gold)':''}">${when}</b></div>`;

function canTrain(a){return !(a.injury>0||a.recovery>0)}
function needsReview(a){return canTrain(a)&&a.revWeek!==S.week}
function planWarns(a){
  const W=[];if(!canTrain(a))return W;
  const end=projFat(a,a.plan);if(end>70)W.push(`<span class="warn">⚠ fadiga ≈${end}: risco de lesão</span>`);
  const trained=new Set(a.plan.filter(p=>trainOK(a,p)).flatMap(p=>Object.keys(TR[p].g)));
  if(a.plan.some(p=>!trainOK(a,p)))trained.add('resistencia');
  const lost=['forca','velocidade','resistencia'].filter(k=>{const l=losing(a,k);return l&&l.lvl==='red'&&!trained.has(k)});
  if(lost.length)W.push(`<span class="lossr">↓ perde ${lost.map(k=>SHORT[k]).join(', ')} esta semana</span>`);
  const w=weeksTo(a);if(a.fight&&w===1&&end>45)W.push(`<span class="warn">🥊 luta na próxima semana: convém aliviar</span>`);
  if(a.plan.some(p=>!trainOK(a,p)))W.push(`<span class="meta">sem equipamento num treino: fica a correr</span>`);
  return W;
}

function lockReason(a,k){
  if(k==='direto'){if(!S.eq.pads)return 'precisa de pads';if(a.attrs.tecnica<20)return 'técnica 20';return 'a aprender'}
  if(k==='gancho'){if(!S.up.treinador)return 'precisa de treinador';if(!S.eq.pads)return 'precisa de pads';if(a.attrs.forca<30)return 'força 30';return 'a aprender'}
  if(k==='uppercut'){if(!S.eq.pads)return 'precisa de pads';if(a.attrs.forca<25)return 'força 25';if(a.attrs.tecnica<25)return 'técnica 25';return 'a aprender'}
  if(k==='corpoDireto')return (a.skills.direto||0)<2?'direto nv 2':'a aprender';
  if(k==='figado'){if((a.skills.gancho||0)<2)return 'gancho nv 2';if(a.attrs.forca<30)return 'força 30';return 'a aprender'}
  if(k==='contra'){if(a.attrs.tecnica<25)return 'técnica 25';if(!(a.def&&a.def.esquiva))return 'esquiva lateral nv 1';return 'a aprender'}
  if(k==='esquiva'){if(!S.eq.esquiva)return 'precisa de corda de esquiva';if(a.attrs.velocidade<20)return 'velocidade 20';return 'a aprender'}
  if(k==='clinch')return a.attrs.resistencia<20?'resistência 20':'a aprender';
  return '';
}
function formOf(a){
  const RS=[];let sc=0;const add=(v,t)=>{sc+=v;if(Math.abs(v)>=.08)RS.push([v,t])};
  if(a.fatigue>50)add(-(a.fatigue-50)/50,'chega cansado');else if(a.fatigue<20)add(.15,'chega fresco');
  const L=(a.tlog||[]).slice(-4);const avg=L.length?L.reduce((t,x)=>t+x.n,0)/L.length:2;
  if(L.length>=3&&avg>=2)add(.25,'treinou com regularidade');else if(avg<1)add(-.35,'treinou pouco nas últimas semanas');
  const last=L.at(-1);if(last&&last.rest&&last.n>0)add(.15,'aliviou na última semana');
  const lostN=['forca','velocidade','resistencia'].filter(k=>a.peak&&a.attrs[k]<a.peak[k]-1.5).length;if(lostN)add(-.15*lostN,'perdeu condição física');
  add((a.conf-55)/150,a.conf>=55?'confiante':'com pouca confiança');
  if(a.recovery>0)add(-.4,'ainda não recuperou da última luta');
  sc=clamp(sc,-1,1);
  return{sc,label:sc>=.3?'Em grande forma':sc<=-.3?'Fora de forma':'Normal',cls:sc>=.3?'good':sc<=-.3?'warn':'',reasons:RS.sort((x,y)=>Math.abs(y[0])-Math.abs(x[0])).map(x=>(x[0]>0?'+ ':'− ')+x[1])};
}
function revealGift(a,why){
  if(a.giftKnown)return '';a.giftKnown=true;
  let m;
  if(a.gift)m=`Descobriste ${why} que ${a.nick} tem um dom: ${GIFTS[a.gift].n}!`;
  else if(a.hint)m=`Afinal ${a.nick} não tem nada de especial: a pista sobre ${GIFTS[a.hint].n.toLowerCase()} era falsa.`;
  else return '';
  note(m);return m;
}
function checkUnlocks(a){
  const out=[];
  if(!a.skills.direto&&S.eq.pads&&a.attrs.tecnica>=20){a.skills.direto=1;out.push('Direto')}
  if(!a.skills.gancho&&S.eq.pads&&S.up.treinador&&a.attrs.forca>=30){a.skills.gancho=1;out.push('Gancho')}
  if(!a.skills.uppercut&&S.eq.pads&&a.attrs.forca>=25&&a.attrs.tecnica>=25){a.skills.uppercut=1;out.push('Uppercut')}
  if(!a.skills.corpoDireto&&(a.skills.direto||0)>=2){a.skills.corpoDireto=1;out.push('Direto ao corpo')}
  if(!a.skills.figado&&(a.skills.gancho||0)>=2&&a.attrs.forca>=30){a.skills.figado=1;out.push('Gancho ao fígado')}
  if(!a.skills.contra&&a.attrs.tecnica>=25&&a.def&&a.def.esquiva>=1){a.skills.contra=1;a.xp.contra=a.xp.contra||0;out.push('Contra-golpe')}
  a.def=a.def||{bloqueio:1,esquiva:0,clinch:0};
  if(!a.def.esquiva&&S.eq.esquiva&&a.attrs.velocidade>=20){a.def.esquiva=1;out.push('Esquiva lateral')}
  if(!a.def.clinch&&a.attrs.resistencia>=20){a.def.clinch=1;out.push('Clinch')}
  a.combos=a.combos||[];
  for(const c of knownCombos(a))if(!a.combos.includes(c.id)){a.combos.push(c.id);out.push('combinação '+c.n)}
  for(const g of out)note(`${a.nick} aprendeu: ${g}.`);
  return out;
}

  <p class="hint">As lutas marcam-se com 6 a 8 semanas de antecedência. Treina, gere a fadiga e, no dia, dá ordens no canto entre rounds.</p>
  <p class="hint">Mais equipamento desbloqueia treinos e traz mais sócios, que pagam mensalidades. Às vezes aparece um talento escondido.</p>`,'VAMOS A ISSO');
}

/* ================= INPUT ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||!S)return;
  if(t.id==='pauseBtn'||t.id==='pauseF'){SFX.play('click');pauseMenu();return}
  if(!t.disabled)SFX.play('click');
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;render();return}
  if(d.sel!==undefined){S.sel=+d.sel;render();return}
  if(d.sub){S.sub=d.sub;render();return}
  if(d.shop){S.shopSub=d.shop;render();return}
  if(d.editplan){editPlan(cur());return}
  if(d.mainsty){const a=cur();if(styleLv(a,d.mainsty)>0){a.style=d.mainsty;a.fstyle=d.mainsty;note(`${a.nick} passa a lutar como ${d.mainsty}.`)}render();return}
  if(d.acc){const a=cur(),o=a.offers.find(x=>x.id===d.acc);if(!o)return;
    a.fight={opp:o.opp,purse:o.purse,week:S.week+o.inWeeks,title:o.title,rounds:o.rounds};a.offers=a.offers.filter(x=>x!==o);
    note(`Luta marcada: ${a.nick} vs ${o.opp.nick}, semana ${a.fight.week}.`);render();return}
  if(d.scout){const a=cur(),o=a.offers.find(x=>x.id===d.scout);if(o)showScout(o.opp,a,o.inWeeks);return}
  if(d.scoutf){const a=cur();if(a.fight)showScout(a.fight.opp,a,weeksTo(a));return}
  if(d.dismiss){const a=S.roster.find(x=>x.id===d.dismiss);if(a)askDismiss(a);return}
  if(d.rej){const a=cur();a.offers=a.offers.filter(x=>x.id!==d.rej);render();return}
  if(d.eq){const id=d.eq,e=EQ[id],have=S.eq[id]||0;if(have>=e.max)return;const c=e.cost[have];if(S.money<c)return;
    S.money-=c;S.eq[id]=have+1;SFX.play('buy');S.roster.forEach(checkUnlocks);note(`Compraste: ${e.n}${have?' (mais um)':''}.`);render();return}
  if(d.up){const u=UPG.find(x=>x.id===d.up);if(!u||S.up[u.id]||S.money<u.cost)return;
    S.money-=u.cost;S.up[u.id]=true;SFX.play('buy');if(u.id==='pintura'||u.id==='ringue')S.pop+=6;if(u.id==='balneario')S.pop+=2;
    S.roster.forEach(checkUnlocks);note(`Compraste: ${u.n}.`);render();return}
  if(t.id==='goBtn'){advanceWeek();return}
  if(t.id==='helpBtn'){help();return}
  if(t.id==='menuBtn'){pauseMenu();return}
  if(t.id==='resetBtn'){const m=modal(`<h2>COMEÇAR DE NOVO?</h2><p class="hint">Perdes todo o progresso deste ginásio.</p><div class="row2"><button class="btn" id="rNo">CANCELAR</button><button class="btn red" id="rYes">APAGAR TUDO</button></div>`);
    m.querySelector('#rNo').onclick=closeModal;m.querySelector('#rYes').onclick=async()=>{ENT=[];occ={};newGame();closeModal();await setupGym();render()};return}
});
function projFat(a,plan){let f=Math.max(0,a.fatigue-15);for(const p of plan){const t=TR[trainOK(a,p)?p:'corrida'];f=clamp(f+(t.f>0&&a.trait==='Preguiçoso'?t.f*.7:t.f),0,100)}return Math.round(f)}
function losing(a,k){
  if(!['forca','velocidade','resistencia'].includes(k)||!a.lastT||a.lastT[k]===undefined)return null;
  const d=S.week-a.lastT[k];if(d<3)return null;
  const base=(a.base&&a.base[k])||0,peak=(a.peak&&a.peak[k])||a.attrs[k];
  const floor=Math.max(base,peak*TUNE.decayFloor),lost=Math.max(0,peak-a.attrs[k]);
  if(a.attrs[k]<=floor+.05)return null;
  return {lvl:d>=4?'red':'warn',lost};
}
function lossMark(a,k){const l=losing(a,k);if(!l)return '';
  return l.lvl==='red'?` <span class="lossr" title="perde condição no fim desta semana se não treinar">↓${l.lost>.05?' −'+l.lost.toFixed(1):''}</span>`
  :` <span class="lossw" title="começa a perder condição se continuar sem treino">↓</span>`}
function fatBox(a,plan){const now=Math.round(a.fatigue),end=projFat(a,plan);const col=v=>v>70?'red':v>45?'gold':'green';
  return `<div class="fatbox"><div class="fl"><small>FADIGA AGORA</small><b>${now}</b><div class="bar ${col(now)}"><i style="width:${now}%"></i></div></div><div class="fl"><small>FIM DA SEMANA</small><b class="${end>70?'warn':''}">≈${end}</b><div class="bar ${col(end)}"><i style="width:${end}%"></i></div></div><p>${end>70?'Acima de 70: risco de lesão.':end>45?'Cansado: treina menos bem e chega pior às lutas.':'Bom nível de fadiga.'}</p></div>`}
function miniStats(a){
  const min=Math.min(...ATTRS.map(([k])=>a.attrs[k]));
  return `<div class="mini">${ATTRS.map(([k])=>`<div class="${a.attrs[k]===min?'low':''}"><small>${SHORT[k].toUpperCase()}${lossMark(a,k)}</small><b>${Math.floor(a.attrs[k])}</b><div class="bar ${a.attrs[k]===min?'red':''}"><i style="width:${clamp(a.attrs[k],0,100)}%"></i></div></div>`).join('')}</div>`;
}
function trainTargets(a,t){return Object.keys(t.g).map(k=>`${SHORT[k]} ${Math.floor(a.attrs[k])}`).join(' · ')}
function editPlan(a){
  const draft=[...a.plan];
  const draw=()=>{
    const ch=draft.some((p,i)=>p!==a.plan[i]);
    const s=modal(`<h2>PLANO DE ${a.nick.toUpperCase()}</h2><p class="hint">Semana ${S.week} · ${needsReview(a)?'⏳ por rever':'✅ revisto'} · toca num treino para o mudar</p>${miniStats(a)}${fatBox(a,draft)}
      <div class="slots">${draft.map((p,i)=>{const tr=TR[p],ok=trainOK(a,p);
        return `<button class="slot" data-ps="${i}"><span class="n">${i+1}</span><span><strong>${tr.n}${p!==a.plan[i]?' <span style="color:var(--gold)">· novo</span>':''}</strong><span class="meta">${ok?(Object.keys(tr.g).length?'Treina '+trainTargets(a,tr):tr.d):'Sem equipamento: fica a correr'}</span></span><em>MUDAR</em></button>`}).join('')}</div>
      <div class="row2"><button class="btn" id="pKeep">MANTER ANTERIOR</button><button class="btn gold" id="pOk">CONFIRMAR PLANO</button></div>
      <button class="btn" id="pX" style="font-size:7px">FECHAR SEM REVER</button>`);
    s.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>pickSlot(+b.dataset.ps));
    s.querySelector('#pX').onclick=closeModal;
    s.querySelector('#pKeep').onclick=()=>{a.revWeek=S.week;closeModal()};
    s.querySelector('#pOk').onclick=()=>{const chg=draft.some((p,i)=>p!==a.plan[i]);a.plan=[...draft];a.revWeek=S.week;
      if(chg){const e=ENT.find(x=>x.id===a.id);if(e){release(e);e.state='idle'}}closeModal()};
  };
  const pickSlot=i=>{
    const s=modal(`<h2>TREINO ${i+1} · ${a.nick.toUpperCase()}</h2><p class="hint">a vermelho o ponto mais fraco · <span class="lossw">↓</span> vai começar a perder · <span class="lossr">↓</span> perde esta semana sem treino</p>${miniStats(a)}${fatBox(a,draft)}
    <div class="pick">${Object.entries(TR).filter(([id,t])=>!t.up||S.up[t.up]).map(([id,t])=>{const ok=trainOK(a,id);
      return `<button data-t="${id}" class="${draft[i]===id?'on':''}" ${ok?'':'disabled'}><strong>${t.n}</strong>${ok?(t.sty?`<em>nv ${styleLv(a,t.sty)}/${styleCap(a,t.sty)}</em>`:Object.keys(t.g).length?`<em>${trainTargets(a,t)}</em>`:'<em>recupera</em>'):`<span>compra ${EQ[t.eq].n.toLowerCase()}</span>`}<span>${t.f<0?'fadiga '+t.f:'fadiga +'+t.f}${ok?(()=>{const pl=[...draft];pl[i]=id;const e=projFat(a,pl);return ` · <b class="${e>70?'warn':''}" style="font-weight:400">fim ≈${e}</b>`})():''}</span></button>`}).join('')}</div>
    <button class="btn" id="mX">VOLTAR AO PLANO</button>`);
    s.querySelector('#mX').onclick=draw;
    s.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{draft[i]=b.dataset.t;draw()});
  };
  draw();
}

/* ================= WEEK ================= */
async function advanceWeek(){
  if(busy)return;busy=true;render();
  if(anyFightNow()){
    for(const a of S.roster){
      if(!(a.fight&&a.fight.week===S.week))continue;
      if(a.injury>0){await info('LUTA CANCELADA',`<p class="hint">${a.nick} está lesionado. A luta com ${a.fight.opp.nick} foi cancelada. Popularidade -2.</p>`);note(`Luta de ${a.nick} cancelada por lesão.`);a.fight=null;S.pop=Math.max(0,S.pop-2);continue}
      await fightFlow(a);
    }
    busy=false;render();return;
  }
  if(!(await weekSummary())){busy=false;render();return}
  const lines=[];
  const reveals=[];
  for(const a of S.roster){
    a.weeks=(a.weeks||0)+1;if(a.weeks>=3){const m=revealGift(a,'nos treinos');if(m)reveals.push(m)}
    a.fatigue=Math.max(0,a.fatigue-15);
    a.tlog=a.tlog||[];
    if(a.injury>0){a.tlog.push({n:0,rest:true});a.fatigue=Math.max(0,a.fatigue-20);lines.push(`<b>${a.nick}</b> esteve a recuperar da lesão.`);continue}
    if(a.recovery>0){a.tlog.push({n:0,rest:true});a.fatigue=Math.max(0,a.fatigue-20);a.recovery--;lines.push(`<b>${a.nick}</b> descansou depois da luta. ${a.recovery?`Faltam ${a.recovery} semana${a.recovery>1?'s':''} de recuperação.`:'Já pode voltar a treinar.'}`);continue}
    const before={...a.attrs};let injured=false;const up=[];let nT=0,rested=false;
    for(const p of a.plan){
      const id=trainOK(a,p)?p:'corrida';const t=TR[id];
      if(id==='descanso'){rested=true;a.fatigue=Math.max(0,a.fatigue+t.f);a.conf=clamp(a.conf+3,0,100);continue}
      nT++;
      if(a.fatigue>70&&Math.random()<(a.fatigue-65)/90){injured=true;break}
      const q=clamp(.6+a.conf/250+R(-.1,.1)+(S.up.treinador?.05:0)+(a.trait==='Trabalhador'?.05:a.trait==='Preguiçoso'?-.08:0),.35,1);
      const m=(id==='sparring'&&S.up.ringue)?1.25:1;
      for(const[k,b]of Object.entries(t.g))gain(a,k,b,q,m);
      if(t.sty)addStyleXP(a,t.sty,Math.round(4*q),up,true);
      if(id==='sparring'&&a.skills.contra>0){a.xp.contra=(a.xp.contra||0)+Math.round(2*q);while(a.skills.contra<5&&a.xp.contra>=a.skills.contra*8){a.xp.contra-=a.skills.contra*8;a.skills.contra++;up.push(`Contra-golpe nv ${a.skills.contra}`)}}
      if(id==='sparring')addStyleXP(a,a.style,Math.max(1,Math.round(1.4*q*m)),up,false);
      if(t.xp){const known=Object.keys(SKILLS).filter(k=>a.skills[k]>0);let pts=Math.round(5*q);
        while(pts-->0){const k=pick(known);a.xp[k]++;while(a.skills[k]<5&&a.xp[k]>=a.skills[k]*8){a.xp[k]-=a.skills[k]*8;a.skills[k]++;up.push(`${SKILLS[k].n} nv ${a.skills[k]}`)}}}
      if(id==='sparring'||id==='esquiva'){const ks=id==='esquiva'?['esquiva']:['bloqueio','clinch'];const kn=ks.filter(k=>a.def[k]>0);let pts=Math.round((id==='esquiva'?5:4)*q);
        while(kn.length&&pts-->0){const k=pick(kn);a.dxp[k]++;while(a.def[k]<5&&a.dxp[k]>=a.def[k]*8){a.dxp[k]-=a.def[k]*8;a.def[k]++;up.push(`${DEFS[k].n} nv ${a.def[k]}`)}}}
      a.fatigue=clamp(a.fatigue+(a.trait==='Preguiçoso'?t.f*.7:t.f),0,100);
    }
    a.tlog.push({n:nT,rest:rested});
    const parts=ATTRS.map(([k])=>{const d=a.attrs[k]-before[k];return d>=.1?`${SHORT[k]} +${d.toFixed(1)}`:''}).filter(Boolean).concat(up,checkUnlocks(a).map(g=>'aprendeu '+g));
    if(injured){a.injury=RI(1,3);lines.push(`<b>${a.nick}</b> <span class="warn">lesionou-se por excesso de treino (${a.injury} sem.).</span> ${parts.join(', ')}`);note(`${a.nick} lesionou-se no treino.`)}
    else lines.push(`<b>${a.nick}</b>: ${parts.join(', ')||'semana leve'} · fadiga ${Math.round(a.fatigue)}`);
  }
  for(const a of S.roster){
    a.tlog=(a.tlog||[]).slice(-6);a.base=a.base||{...a.attrs};a.peak=a.peak||{...a.attrs};a.lastT=a.lastT||{};
    const lost=[];
    for(const k of['forca','velocidade','resistencia']){
      if(a.lastT[k]===undefined)a.lastT[k]=S.week;
      if(S.week-a.lastT[k]>3){const floor=Math.max(a.base[k],a.peak[k]*TUNE.decayFloor);if(a.attrs[k]>floor){const d=Math.min(TUNE.decay,a.attrs[k]-floor);a.attrs[k]-=d;if(d>.05)lost.push(SHORT[k])}}
    }
    if(lost.length)lines.push(`<b>${a.nick}</b> <span class="warn">está a perder condição física (${lost.join(', ')}) por falta de treino.</span>`);
  }
  const fightLines=[];
  const fees=S.members*ECON.fee,spons=sponsors(),WC=weeklyCosts();
  S.money=Math.max(0,S.money+fees+spons-WC.total);
  const prevM=S.members,cap=capacity();
  const target=Math.min(cap,3+Math.floor(S.pop/3)+eqUnits()+(S.up.pintura?2:0));
  if(S.members<target)S.members+=Math.min(2,target-S.members);else if(S.members>target)S.members--;
  let extra='';
  if(!S.up.pintura&&S.members>8&&Math.random()<.4){S.members--;extra='Um sócio saiu a queixar-se do estado das paredes.'}
  for(const r of S.rivals)if(Math.random()<.15&&r.lvl<8)r.lvl+=1;
  S.pop=Math.min(100,S.pop);
  S.week++;
  const news=[...reveals];
  for(const a of S.roster){
    if(a.injury>0)a.injury--;
    a.offers=a.offers.filter(o=>o.expires>=S.week);
    if(!a.fight&&a.rank<=3&&!a.offers.some(o=>o.title)){if(a.offers.length>=3)a.offers.shift();addOffer(a);news.push(`${a.nick} é desafiante oficial: tem uma proposta para lutar pelo título ${TIERS[a.tier].n}!`)}
    else if(!a.fight&&Math.random()<.3+S.pop/200){const n=a.offers.length;addOffer(a);if(a.offers.length>n)news.push(`Nova proposta para ${a.nick}.`)}
  }
  note(`Semana fechada: ${fees+spons-WC.total>=0?'+':''}${fees+spons-WC.total} €.`);
  const dm=S.members-prevM;
  SFX.play(fees+spons-WC.total>=0?'coin':'week');
  await info(`SEMANA ${S.week-1}`,`<div class="rep">
    <div class="r"><div><strong>TREINOS</strong>${lines.map(l=>`<p>${l}</p>`).join('')}</div></div>
    ${fightLines.length?`<div class="r"><div><strong>LUTAS</strong>${fightLines.map(l=>`<p>${l}</p>`).join('')}</div></div>`:''}
    <div class="r"><div><strong>CONTAS · SALDO ${fees+spons-WC.total>=0?'+':''}${fmt(fees+spons-WC.total)} €</strong><p>Mensalidades <span class="good">+${fees} €</span>${spons?` · Patrocínios <span class="good">+${spons} €</span>`:''}</p><p>Salários <span class="warn">-${WC.sal} €</span>${WC.staff?` · Staff <span class="warn">-${WC.staff} €</span>`:''} · Renda <span class="warn">-${WC.rent} €</span> · Manutenção <span class="warn">-${WC.maint} €</span></p><p>Sócios ${dm>=0?'+':''}${dm} (agora ${S.members}/${capacity()})${extra?' · '+extra:''}</p></div></div>
    ${news.length?`<div class="r"><div><strong>NOVIDADES</strong>${news.map(l=>`<p>${l}</p>`).join('')}</div></div>`:''}
  </div>`);
  for(const a of [...S.roster])if(a.pendingRaise)await negotiate(a);
  const empty=CATS.filter(c=>!S.roster.some(a=>a.cat===c));
  if(empty.length&&S.week>3&&Math.random()<.14+S.pop/400)await talent(pick(empty));
  else if(S.week>3&&Math.random()<.05+S.pop/800)await talent(pick(CATS.filter(c=>!empty.includes(c))));
  busy=false;render();
}
function gain(a,k,base,q,mult=1){
  let g=TUNE.train*base*(.3+.9*q)*(1-a.fatigue/160)*mult;
  if(a.trait==='Trabalhador')g*=1.25;if(a.trait==='Preguiçoso')g*=.8;if(S.up.treinador)g*=1.2;
  g*=clamp((a.cap[k]-a.attrs[k])/20,.06,1);
  a.attrs[k]=clamp(a.attrs[k]+g,0,a.cap[k]+2);
  if(g>.02){a.lastT=a.lastT||{};a.lastT[k]=S.week;a.peak=a.peak||{};a.peak[k]=Math.max(a.peak[k]||0,a.attrs[k])}
}
function dismissCost(a){const pen=1+(a.fight?3:0)+a.titles.length*2+(a.rec.w>=5?1:0);return{money:a.salary*2,pop:pen}}
function doDismiss(a){const c=dismissCost(a);S.money=Math.max(0,S.money-c.money);S.pop=Math.max(0,S.pop-c.pop);
  S.roster=S.roster.filter(x=>x!==a);S.sel=0;note(`${a.name} "${a.nick}" saiu do ginásio${a.fight?' e a luta marcada foi cancelada':''}.`)}
function dismissText(a){const c=dismissCost(a);return `Pagas ${c.money} € de indemnização (2 semanas de salário) e perdes ${c.pop} de popularidade${a.fight?' (inclui cancelar a luta marcada)':''}${a.titles.length?' (os sócios não gostam de ver sair um campeão)':''}.`}
function askDismiss(a){
  const m=modal(`<h2>DISPENSAR ${a.nick.toUpperCase()}?</h2><p class="hint">${dismissText(a)}</p><p class="hint">A categoria ${a.cat.toLowerCase()} fica livre para novos talentos.</p>
  <div class="row2"><button class="btn" id="dNo">CANCELAR</button><button class="btn red" id="dYes">DISPENSAR</button></div>`);
  m.querySelector('#dNo').onclick=closeModal;m.querySelector('#dYes').onclick=()=>{doDismiss(a);closeModal()};
}
async function negotiate(a){
  const req=Math.max(Math.round(a.salary*a.pendingRaise/5)*5,a.pendingRaise>=1.6?[45,90,220,600][a.tier]:0),ctr=Math.round((a.salary+req)/2/5)*5;a.pendingRaise=0;
  return new Promise(res=>{
    const m=modal(`<h2>${a.nick.toUpperCase()} QUER UM AUMENTO</h2><p class="hint">${a.titles.length?'Depois do título':'Depois de uma série de vitórias'}, ${a.nick} pede para passar de ${a.salary} € para <b>${req} € por semana</b>.</p>
      <p class="hint">Personalidade: ${a.trait} · Confiança ${Math.round(a.conf)}${a.refusals?` · já recusaste ${a.refusals} vez${a.refusals>1?'es':''}`:''}</p>
      <div class="rows"><button class="btn gold" id="nA">ACEITAR (${req} €)</button><button class="btn" id="nC">CONTRAPROPOSTA (${ctr} €)</button><button class="btn red" id="nR">RECUSAR</button></div>`);
    const end=t=>{closeModal();note(t);info('NEGOCIAÇÃO',`<p class="hint">${t}</p>`).then(res)};
    const refuse=async(t)=>{a.conf=clamp(a.conf-12,0,100);a.refusals=(a.refusals||0)+1;
      if(a.refusals>=2&&S.roster.length>1){closeModal();
        const q=modal(`<h2>${a.nick.toUpperCase()} QUER SAIR</h2><p class="hint">${t} ${a.nick} sente-se desvalorizado e quer ir para outro ginásio.</p><div class="row2"><button class="btn" id="lGo">DEIXÁ-LO IR</button><button class="btn gold" id="lPay">PAGAR ${req} €</button></div>`);
        q.querySelector('#lGo').onclick=()=>{S.roster=S.roster.filter(x=>x!==a);S.sel=0;S.pop=Math.max(0,S.pop-2);end(`${a.nick} saiu do ginásio.`)};
        q.querySelector('#lPay').onclick=()=>{a.salary=req;a.refusals=0;a.conf=clamp(a.conf+8,0,100);end(`${a.nick} fica, agora a ganhar ${req} € por semana.`)};
      }else end(t+' Ficou com menos confiança.')};
    m.querySelector('#nA').onclick=()=>{a.salary=req;a.refusals=0;a.conf=clamp(a.conf+6,0,100);end(`${a.nick} aceita: agora ganha ${req} € por semana.`)};
    m.querySelector('#nC').onclick=()=>{const p=.5+(a.conf-50)/150+(a.trait==='Trabalhador'?.15:a.trait==='Teimoso'?-.2:a.trait==='Cabeça fria'?.05:0);
      if(Math.random()<p){a.salary=ctr;a.refusals=0;end(`${a.nick} aceita a contraproposta: ${ctr} € por semana.`)}else refuse(`${a.nick} recusa a contraproposta.`)};
    m.querySelector('#nR').onclick=()=>refuse(`Recusaste o aumento de ${a.nick}.`);
  });
}
function talent(cat){
  return new Promise(res=>{
    const used=S.roster.map(x=>x.nick);const a=makeAthlete(cat,{boost:RI(0,6),nick:pick(NICKS.filter(n=>!used.includes(n)))});

    const el=(now-F.confetti)/1000;for(const q of F.conf){const y=q.y0+el*q.v*55;if(y<-4||y>244)continue;const x=q.x+Math.sin(el*q.w+q.ph)*5;c.fillStyle=q.c;const fl=Math.sin(el*q.w*2+q.ph)>0;c.fillRect(Math.round(x),Math.round(y),fl?3:1,2)}}
  if(F.big){const by=F.bigTop?18:96;c.fillStyle='rgba(0,0,0,.6)';c.fillRect(40,by,160,30);c.fillStyle='#e8b13a';c.font='16px "Press Start 2P", monospace';c.textAlign='center';c.fillText(F.big,120,by+22)}
  drawCaster(now);
  requestAnimationFrame(ringLoop);
}

/* ================= BOOT ================= */
/* ---- start / pause menu ---- */
function menu(mode){
  return new Promise(res=>{
    const saved=mode==='start'?load():S;const hasSave=!!(saved&&saved.roster);
    const main=()=>{
      const m=modal(`<div class="menu"><div class="mtitle">CORNER MEN</div>
        <div class="mlogo">${logoImg((saved&&saved.logo)||0,40)}</div>
        ${mode==='start'?(hasSave?`<button class="btn gold big" id="mCont">CONTINUAR<small>${(saved.gymName||'Ginásio Esperança')} · semana ${saved.week}</small></button>`:''):`<button class="btn gold big" id="mCont">${mode==='fight'?'VOLTAR À LUTA':'VOLTAR AO JOGO'}</button>`}
        ${mode!=='fight'?`<button class="btn big ${mode==='start'&&!hasSave?'gold':''}" id="mNew">NOVO JOGO</button>`:''}
        <button class="btn" id="mSet">DEFINIÇÕES</button>
        ${mode!=='fight'?'<button class="btn" id="mHelp">COMO JOGAR</button>':''}</div>`);
      const q=id=>m.querySelector(id);
      if(q('#mCont'))q('#mCont').onclick=()=>{$('#modalRoot').innerHTML='';if(S)render();res('cont')};
      if(q('#mNew'))q('#mNew').onclick=()=>{if(!hasSave){$('#modalRoot').innerHTML='';res('new');return}
        const c=modal(`<div class="menu"><h2>COMEÇAR DE NOVO?</h2><p class="hint">Perdes todo o progresso de ${saved.gymName||'este ginásio'}.</p><div class="row2"><button class="btn" id="rNo">CANCELAR</button><button class="btn red" id="rYes">APAGAR E COMEÇAR</button></div></div>`);
        c.querySelector('#rNo').onclick=main;c.querySelector('#rYes').onclick=()=>{$('#modalRoot').innerHTML='';res('new')}};
      q('#mSet').onclick=sett;
      if(q('#mHelp'))q('#mHelp').onclick=async()=>{await help();main()};
    };
    const sett=()=>{
      const m=modal(`<div class="menu"><h2>DEFINIÇÕES</h2>
        <button class="btn big ${SFX.on?'gold':''}" id="mSnd">SOM: ${SFX.on?'LIGADO':'DESLIGADO'}</button>
        <button class="btn" id="mBack">VOLTAR</button></div>`);
      m.querySelector('#mSnd').onclick=()=>{SFX.setOn(!SFX.on);SFX.play('click');sett()};
      m.querySelector('#mBack').onclick=main;
    };
    main();
  });
}
async function pauseMenu(){
  if(F){F.paused=true;const r=await menu('fight');F.paused=false;return r}
  const r=await menu('pause');
  if(r==='new'){ENT=[];occ={};newGame();render();await setupGym();render()}
}

async function start(){
  try{document.fonts&&document.fonts.ready.then(()=>{ARENA=null})}catch(e){}
  const choice=await menu('start');
  S=choice==='new'?null:load();
  let fresh=false;if(!S||!S.roster){newGame();fresh=true}
  S.gymName=S.gymName||'Ginásio Esperança';S.logo=S.logo||0;
  for(const a of S.roster){migrateStyles(a);initBody(a,2);if(a.fight){migrateStyles(a.fight.opp);initBody(a.fight.opp,clamp(a.tier+1,1,5))}for(const o of a.offers||[]){migrateStyles(o.opp);initBody(o.opp,clamp(a.tier+1,1,5))}}
  for(const a of S.roster){for(const k of Object.keys(SKILLS)){a.skills[k]=a.skills[k]||0;a.xp[k]=a.xp[k]||0}a.def=a.def||{bloqueio:1,esquiva:0,clinch:0};a.dxp=a.dxp||{bloqueio:0,esquiva:0,clinch:0};a.combos=a.combos||knownCombos(a).map(c=>c.id);a.recovery=a.recovery||0;if(a.gift===undefined){a.gift=null;a.giftKnown=true}a.weeks=a.weeks||0}
  S.tab=S.tab||'gym';
  render();requestAnimationFrame(world);
  if(fresh){await setupGym();render()}
  if(!S.seen){S.seen=true;save();await help()}
}
start();
})();

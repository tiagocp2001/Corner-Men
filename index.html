<!doctype html><html><head><meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Corner Men">

<link rel="icon" type="image/png" href="icons/icon-192.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Corner Men</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one fixed phone screen — HUD, gym window, switchable panel, bottom menu. Nothing scrolls the page. */
:root{
  --bg:#17130f; --panel:#231c16; --panel2:#2e251d; --line:#463a2d;
  --fg:#f1e5d0; --muted:#a8957d; --red:#d4452f; --gold:#e8b13a; --blue:#5b8fc4; --green:#74b35d;
  --f-display:'Silkscreen', ui-monospace, monospace; /* títulos, nomes, botões, placard, pop-ups, palavras de estado */
  --f-num:'Silkscreen', ui-monospace, monospace;     /* números */
  --f-body:'VT323', ui-monospace, monospace;         /* textos (frases, análise, dicas, ajuda) */
  --f-mono:'VT323', ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
*{font-variant-ligatures:none}
body{color:var(--fg);font-family:var(--f-body);font-size:20px;line-height:1.01;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px 0}
h2,h3{font-family:var(--f-display);font-weight:400;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-weight:700}
h2{font-size:14.5px;line-height:1.2}
h3{font-size:10.5px;color:var(--muted);letter-spacing:.05em}
p{margin:0}
.hud{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:5px;flex:none}
.hud div{background:var(--panel);border:2px solid var(--line);padding:4px 6px;min-width:0}
.hud small{display:block;font-family:var(--f-display);font-size:8px;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
.hud b{font-family:var(--f-num);font-size:14px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.screen{position:relative;border:3px solid #0b0907;outline:2px solid var(--line);background:#000;line-height:0;flex:none}
canvas.px{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.tagl{position:absolute;left:5px;top:5px;line-height:1;font-family:var(--f-display);font-size:9.5px;background:rgba(0,0,0,.65);color:var(--fg);padding:4px 5px}
.dayover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;gap:6px;line-height:1;pointer-events:none}
.dayover b{font-family:var(--f-display);font-size:14.5px;background:rgba(0,0,0,.7);padding:6px 8px;color:var(--gold);font-weight:400}
.skip{position:absolute;right:5px;bottom:5px;line-height:1}
.panel{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.scrolly{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:6px}
.nav{flex:none;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;gap:4px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.nav button{background:var(--panel);border:2px solid var(--line);color:var(--muted);font-family:var(--f-display);font-size:9.5px;padding:12px 2px 10px;cursor:pointer;line-height:1.05;position:relative}
.nav button.on{color:var(--fg);border-color:var(--gold);background:var(--panel2)}
.nav button.go{background:var(--gold);color:#1b140c;border-color:#9c7420;border-bottom-width:4px}
.nav button.go:disabled{opacity:.5}
.nav button.go.fightgo{background:var(--red);border-color:#8f2a1b;color:#fff}
.badge{position:absolute;top:-6px;right:-3px;background:var(--red);color:#fff;font-size:9.5px;padding:3px 4px;font-family:var(--f-display)}
/* relógio: tempo a correr sozinho (▶ / pausa, ×1 / ×2), dias da semana por cima do ginásio, avisos curtos e cartões */
.nav .clkb{display:grid;grid-template-columns:1.5fr 1fr;gap:3px;min-width:0}
.nav .clkb button{padding:0;min-width:0;display:flex;align-items:center;justify-content:center}
.nav .clkb button.fightgo{grid-column:1/-1;padding:12px 2px 10px}
.nav button.go.run{background:var(--panel2);color:var(--gold);border-color:var(--gold)}
.nav button.spd{color:var(--fg);font-size:10.5px} .nav button.spd.x2{color:var(--gold);border-color:var(--gold)}
.icp{display:block;width:0;height:0;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent currentColor}
.icpa{display:block;width:12px;height:14px;border-left:4px solid currentColor;border-right:4px solid currentColor;box-sizing:border-box}
.days{position:absolute;left:5px;top:5px;right:54px;z-index:2;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;line-height:1;pointer-events:none}
.days i{position:relative;font-style:normal;font-family:var(--f-display);font-size:8px;color:#9c8a70;background:rgba(0,0,0,.7);padding:5px 0 4px;text-align:center;overflow:hidden}
.days i u{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(232,177,58,.5);text-decoration:none}
.days i span{position:relative}
.days i.tr::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--red)}
.days i.dn{color:var(--fg)} .days i.now{color:#fff}
.days.off i u{background:rgba(170,160,145,.35)}
.toasts{position:absolute;left:5px;right:5px;top:23px;z-index:2;display:flex;flex-direction:column;gap:3px;align-items:flex-start;pointer-events:none;line-height:1}
.toast{max-width:100%;box-sizing:border-box;font-family:var(--f-mono);font-size:16px;background:rgba(10,8,6,.88);border-left:3px solid var(--gold);color:var(--fg);padding:3px 7px;animation:tin .25s steps(3);transition:opacity .5s}
.toast b{font-weight:400;color:var(--gold)} .toast .warn{font-size:inherit}
.toast.wk{align-self:stretch;border:1px solid var(--gold);border-left-width:3px;padding:4px 7px}
.toast.wk div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.out{opacity:0}
@keyframes tin{from{transform:translateX(-12px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.cardb{display:flex;flex-direction:column;gap:6px}
.cardb .btn small{display:block;font-family:var(--f-body);font-size:16px;letter-spacing:0;margin-top:3px;opacity:.85}
#pauseBtn{font-size:9.5px!important}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;flex:none}
.seg button{background:var(--panel);border:2px solid var(--line);color:var(--muted);padding:6px 4px;font-family:var(--f-body);font-size:17.5px;cursor:pointer;min-width:0;line-height:1}
.seg button b{display:block;font-family:var(--f-display);font-size:8px;letter-spacing:.08em;margin-bottom:2px;font-weight:400}
.seg button.on{background:var(--panel2);color:var(--fg);border-color:var(--gold)}
.seg button:disabled{opacity:.45}
.card{background:var(--panel);border:2px solid var(--line);padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.who{display:flex;gap:10px;align-items:center}
.who canvas{width:48px;height:48px;image-rendering:pixelated;border:2px solid var(--line);background:#3a2d22;flex:none}
.nm{font-family:var(--f-display);font-size:12px;line-height:1.12}
.nm em{font-style:normal;color:var(--gold)}
.meta{color:var(--muted);font-size:17.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:2px solid var(--line);padding:1px 5px;font-size:16px;background:var(--panel2)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chip.lock{opacity:.5}
.stats{display:grid;gap:3px}
.stat{display:grid;grid-template-columns:78px 1fr 26px;gap:7px;align-items:center;font-size:17.5px}
.bar{height:8px;background:#120e0b;border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.bar.red i{background:var(--red)} .bar.gold i{background:var(--gold)} .bar.blue i{background:var(--blue)} .bar.green i{background:var(--green)}
.num{font-family:var(--f-num);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.warn{color:var(--red);font-size:17.5px}
.good{color:var(--green)}
.btn{background:var(--panel2);color:var(--fg);border:2px solid var(--line);border-bottom-width:4px;font-family:var(--f-display);font-size:10.5px;padding:10px 6px 8px;cursor:pointer;line-height:1.12;text-align:center}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.red{background:var(--red);border-color:#8f2a1b;color:#fff}
.btn.gold{background:var(--gold);border-color:#9c7420;color:#1b140c}
.btn.big{font-size:13.5px;padding:14px 8px 12px;width:100%}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:8px 10px;cursor:pointer;color:var(--fg);text-align:left;font-family:var(--f-body);font-size:18.5px}
.slot .n{font-family:var(--f-display);font-size:13.5px;color:var(--gold)}
.slot strong{display:block;font-family:var(--f-display);font-size:10.5px;font-weight:400;margin-bottom:3px;line-height:1.12}
.slot span.meta{font-size:16px}
.slot em{font-style:normal;font-family:var(--f-display);font-size:9.5px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:5px}
.r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:6px 8px;min-width:0}
.r strong{font-family:var(--f-display);font-size:9.5px;font-weight:400;line-height:1.2;display:block}
.r p{font-size:16px;color:var(--muted)}
.r .btn{font-size:9.5px;padding:8px 6px 6px;white-space:nowrap}
.log{background:#0f0c09;border:2px solid var(--line);padding:6px 8px;font-family:var(--f-mono);font-size:17px;line-height:1.05;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;flex:1}
.log span:first-child{color:var(--fg)}
.log b{color:var(--gold);font-weight:400}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.kv div{background:var(--panel);border:2px solid var(--line);padding:5px 7px}
.kv small{display:block;font-family:var(--f-display);font-size:8px;color:var(--muted);letter-spacing:.08em;margin-bottom:3px}
.kv b{font-family:var(--f-num);font-size:14px;font-weight:400;line-height:1}
.empty{color:var(--muted);font-size:18.5px;padding:8px 2px}
.tag{font-size:14.5px;padding:0 5px;border:2px solid var(--line)}
.tag.g{color:var(--green);border-color:var(--green)} .tag.b{color:var(--red);border-color:var(--red)} .tag.m{color:var(--gold);border-color:var(--gold)}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(8,6,4,.8);display:flex;align-items:flex-end;justify-content:center;z-index:90;padding-top:max(10px,env(safe-area-inset-top,0px))}
.sheet{background:var(--panel);border:3px solid var(--line);border-bottom:none;width:100%;max-width:540px;max-height:100%;overflow:auto;
  padding:14px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;animation:up .16s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.hint{color:var(--muted);font-size:18.5px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pick button{background:var(--panel2);border:2px solid var(--line);color:var(--fg);padding:8px 5px;cursor:pointer;text-align:left;font-family:var(--f-body);font-size:16px;line-height:1;min-height:62px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pick button strong{font-family:var(--f-display);font-size:9.5px;font-weight:400;line-height:1.12}
.pick button span{color:var(--muted)}
.pick button.on{border-color:var(--gold)}
.pick button:disabled{opacity:.4}
.lossw{color:var(--gold)} .lossr{color:var(--red)} .mini small .lossw,.mini small .lossr{font-size:12px}
.plancard{gap:3px;padding:7px 9px;font-size:16px;overflow:auto;min-height:0} .plancard .meta,.plancard .warn{font-size:16px;line-height:1.01}
.planbox{grid-template-columns:1fr auto!important;padding:9px 10px!important}
.planbox .pl{display:block;font-size:18.5px;color:var(--fg);margin-top:2px}
.planbox em.ed{font-style:normal;font-family:var(--f-display);font-size:9.5px;color:#1b140c;background:var(--gold);padding:7px 8px;line-height:1.12;text-align:center}
.plan3{grid-template-columns:repeat(3,1fr)}
.plan3 .slot{grid-template-columns:1fr;gap:3px;padding:6px 7px;align-content:start;min-width:0}
.plan3 .slot .n{font-size:8px;color:var(--muted)}
.plan3 .slot strong{margin:0}
.plan3 .slot span.meta{font-size:14.5px;line-height:1}
.panel .card .btn.keep{padding:6px;font-size:9.5px}
.seg .wk{font-size:13.5px;opacity:.85}
.seg.sub2 button{padding:4px;font-family:var(--f-display);font-size:9.5px;letter-spacing:.06em}
.txt{width:100%;background:var(--panel2);border:2px solid var(--line);color:var(--fg);font-family:var(--f-body);font-size:21.5px;padding:8px}
.txt:focus{outline:none;border-color:var(--gold)}
.logos{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.logos button{background:var(--panel2);border:2px solid var(--line);color:var(--muted);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--f-display);font-size:9.5px;cursor:pointer}
.logos button.on{border-color:var(--gold);color:var(--fg)}
.tagl img{margin:-2px 2px 0 0}
.snd{position:absolute;right:5px;top:5px;z-index:3;background:rgba(0,0,0,.65);color:var(--fg);border:1px solid rgba(255,255,255,.2);font-family:var(--f-display);font-size:9.5px;line-height:1;padding:5px 6px;cursor:pointer}
.stage .snd{top:auto;bottom:5px;right:5px}
.stys{display:flex;flex-direction:column;gap:4px}
.sty{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);padding:4px 6px;font-size:16px}
.sty.on{border-color:var(--gold)}
.sty b{font-family:var(--f-display);font-size:9.5px;font-weight:400}
.skc{min-height:0;gap:3px;padding:5px 8px;overflow:hidden}
.skg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.skg h3{margin-bottom:2px}
.skr{display:flex;justify-content:space-between;align-items:center;gap:4px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:.95;padding:1px 0;cursor:pointer;text-align:left;min-width:0}
.skr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.skr.lock{color:var(--muted);opacity:.65}
.skr .pp{display:flex;gap:1px;flex:none}.skr .pp b{width:6px;height:6px;background:#3a2d22;border:1px solid #5a4632}.skr .pp b.f{background:var(--gold);border-color:var(--gold)}
.skr em,.sknote em{font-style:normal;margin-right:2px}.cfu{color:var(--gold)}.cfo{color:#ff7a66}
.sknote{font-size:14.5px;line-height:1;color:var(--muted)}
.tkc{min-height:0;gap:3px;padding:5px 8px;overflow:hidden}
.tkl{display:block;width:100%;background:var(--panel2);border:1px solid var(--gold);padding:2px 6px;font-size:15.5px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkl b{font-family:var(--f-display);font-size:9.5px;font-weight:400;color:var(--gold)} .tkl i{font-style:normal;color:var(--fg)} .tkl.none{border-color:var(--line);color:var(--muted)}
.tkg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 6px} .tkc h3{margin:0;line-height:1}
.tkb{display:flex;justify-content:space-between;align-items:center;gap:3px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font-family:var(--f-body);font-size:15.5px;line-height:.86;padding:0;cursor:pointer;text-align:left;min-width:0}
.tkb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0} .tkb em{font-style:normal;flex:none;font-size:13px;color:var(--muted)}
.tkb.kn{color:var(--gold)} .tkb.kn em{color:var(--gold)} .tkb.ln{color:#ffd76a} .tkb.ln em{color:#ffd76a} .tkb.lock{color:var(--muted);opacity:.55}
.tkh{display:flex;justify-content:space-between;align-items:baseline} .tkh .meta{font-size:15px}
.tslot{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}.tslot i{width:9px;height:7px;background:#3a2d22;border:1px solid #5a4632}.tslot i.f{background:var(--gold);border-color:var(--gold)}
.treq{font-size:16px;line-height:1.05} .treq .ok{color:var(--green)} .treq .no{color:#ff7a66}
.pips{display:flex;gap:2px;margin:2px 0}.pips i{width:12px;height:5px;background:#3a2d22;border:1px solid #5a4632}.pips i.f{background:var(--gold);border-color:var(--gold)}.pips i.x{opacity:.25}
.menu{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center;padding:6px 0}
.menu .mtitle{font-family:var(--f-display);font-size:29.5px;color:var(--gold);letter-spacing:.06em;text-shadow:3px 3px 0 #8f2a1b;margin:6px 0 2px}
.menu .mlogo{display:flex;justify-content:center;margin-bottom:6px}
.menu .btn small{display:block;font-family:var(--f-body);font-size:16px;letter-spacing:0;margin-top:4px;opacity:.85}
.snd{font-size:12px!important;padding:5px 7px!important}
.rdot{position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--red);border-radius:50%}
.sumr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:6px 8px}
.fatbox{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;background:var(--panel2);border:2px solid var(--line);padding:6px 8px}
.fatbox .fl{display:flex;flex-direction:column;gap:3px}
.fatbox small{font-family:var(--f-display);font-size:8px;color:var(--muted);letter-spacing:.06em}
.fatbox b{font-family:var(--f-num);font-size:14px;font-weight:400;line-height:1}
.fatbox p{grid-column:1/-1;font-size:16px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.mini div{background:var(--panel2);border:2px solid var(--line);padding:4px 3px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mini small{font-family:var(--f-display);font-size:8px;color:var(--muted);letter-spacing:.06em}
.mini b{font-family:var(--f-num);font-size:13px;font-weight:400;line-height:1}
.mini .low{border-color:var(--red)} .mini .low small{color:var(--red)}
.pick button em{font-style:normal;color:var(--gold);font-size:16px}
.pick2{grid-template-columns:repeat(2,1fr)}.pick2 button{min-height:46px}
.slot.padf{border-color:var(--gold);padding:6px 10px}
.rep{display:flex;flex-direction:column;gap:6px}
.rep .r{grid-template-columns:1fr}
.rep .r p{color:var(--fg);font-size:17.5px}
.stars{color:var(--gold);letter-spacing:1px}
.talent canvas{width:84px;height:84px;image-rendering:pixelated;border:2px solid var(--line);background:#3a2d22;align-self:center}
.quote{font-size:18.5px;color:var(--muted);text-align:center;font-style:italic}

/* fight */
.fight{position:fixed;inset:0;z-index:70;background:#0c0a08;display:flex;flex-direction:column;gap:6px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.fight>*{max-width:520px;width:100%;margin:0 auto}
.fight .bar i.v{transition:width .7s ease}
.fight .bar i.pv{position:absolute;top:0;bottom:0;width:0}
.fight .bar.gold i.pv{background:rgba(255,236,170,.65)} .fight .bar.red i.pv{background:rgba(255,170,150,.65)}
.fight .fside.rt .bar i.pv{display:none}
.fhead{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;flex:none}
.fside{display:flex;flex-direction:column;gap:3px;min-width:0}
.fside.rt{text-align:right}
.fside.rt .bar i{left:auto;right:0}
.fname{font-family:var(--f-display);font-weight:700;font-size:12px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fst{font-family:var(--f-display);font-size:9px;line-height:1.1;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fws{display:flex;gap:3px;flex-wrap:wrap;min-height:0}
.fside.rt .fws{justify-content:flex-end}
.fws i,.stw i{font-style:normal;font-family:var(--f-display);font-size:8px;line-height:1;padding:2px 3px 1px;background:#7a1e14;color:#ffd9cf;border:1px solid #ff6b5a;white-space:nowrap}
.fight .bar{height:9px}
.fight .bar i.lo{position:absolute;top:0;bottom:0;width:0;background:#ff3b2a;opacity:0;transition:opacity .6s}
.fight .fside.rt .bar i.lo{left:auto}
.fight .bar.flash{box-shadow:0 0 0 2px #ff3b2a}
.fight .bar.flash i.lo{opacity:1;transition:none}
.fclock{text-align:center;font-family:var(--f-display);font-size:9px;color:var(--muted);line-height:1.2;padding-top:2px}
.fclock b{display:block;font-family:var(--f-num);font-size:20px;font-weight:400;color:var(--fg);line-height:1.1}
.stagew{display:flex;justify-content:center;flex:1 1 0;min-height:150px;overflow:hidden}
.stage{position:relative;line-height:0;border:3px solid #0b0907;outline:2px solid var(--line);border-radius:4px;overflow:hidden;width:100%;height:100%}
.fight canvas.px{display:block;width:100%;height:100%}
.stage .fhead{position:absolute;left:6%;right:6%;top:5px;background:rgba(10,8,6,.82);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 8px 5px;line-height:1.01}
.fdist{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:3px;font-family:var(--f-display);font-size:8px;line-height:1;color:#7d7064;margin-top:1px}
.fdist i{font-style:normal;padding:2px 4px 1px;border-radius:2px;background:#15110d;transition:background .25s,color .25s} .fdist b{font-weight:400;opacity:.6}
.fdist i.on{background:#e8b13a;color:#1a1410} .fdist.off i.on{background:#5c4a2a;color:#d8c9a8}
/* mesa dos comentadores: o Zé do Micro à esquerda, o Abílio à direita; o balão sai do lado de quem fala; tocar abre o registo */
.desk{flex:none;position:relative;height:66px;display:grid;grid-template-columns:46px 1fr 46px;gap:6px;align-items:end;background:#0f0c09;border:2px solid var(--line);padding:3px 4px 0;cursor:pointer}
.desk:before{content:'';position:absolute;left:0;right:0;bottom:0;height:9px;background:#4a3424;border-top:1px solid #5e4430}
.desk .cm{position:relative;display:flex;flex-direction:column;align-items:center;z-index:1;line-height:0}
.desk .cm canvas{width:44px;height:53px;image-rendering:pixelated;display:block}
.desk .cm.off{opacity:.45;filter:saturate(.5)}
.desk .cm b{position:absolute;bottom:-1px;font-family:var(--f-display);font-size:7px;font-weight:400;line-height:1;color:#f1e5d0;letter-spacing:.04em;white-space:nowrap;z-index:2}
.desk .cm.ab b{color:#bfe3c8}
.desk .sb{align-self:center;position:relative;z-index:1;background:#f4ecdc;color:#1a1410;border:2px solid #1a1410;padding:3px 7px 2px;font-family:var(--f-mono);font-size:17px;line-height:.95;margin-bottom:6px;min-height:22px;max-height:44px;overflow:hidden;overflow-wrap:anywhere}
.desk .sb.s2{font-size:15px} .desk .sb.s3{font-size:13.5px;line-height:.9}
.desk .sb.big{background:#ffe9a8;border-color:#9c7420}
.desk .sb.me{color:#8f2416}
.desk .sb:after{content:'';position:absolute;top:50%;margin-top:-5px;border:5px solid transparent}
.desk .sb.L:after{left:-9px;border-right:6px solid #1a1410;border-left:0}
.desk .sb.R:after{right:-9px;border-left:6px solid #1a1410;border-right:0}
.desk .sb.big.L:after{border-right-color:#9c7420} .desk .sb.big.R:after{border-left-color:#9c7420}
.desk .reg{position:absolute;right:54px;top:2px;font-family:var(--f-display);font-size:7px;line-height:1;color:#6b5a48;z-index:2}
/* registo da luta (a luta pára enquanto está aberto) */
.logov{position:absolute;inset:0;z-index:20;background:rgba(8,6,4,.97);display:flex;flex-direction:column;gap:8px;cursor:pointer;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.logov>*{max-width:520px;width:100%;margin:0 auto}
.logov h2{font-size:12px;color:var(--gold);display:flex;justify-content:space-between;align-items:center;flex:none}
.logov h2 span{font-size:8px;color:var(--muted)}
.logov .ll{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;overflow:hidden;justify-content:flex-end}
.logov .ln{flex:none;display:grid;grid-template-columns:26px 1fr;gap:7px;align-items:start;background:#15110d;border:1px solid #3a2d22;padding:4px 6px 4px 4px}

.logov .ln b.ab{color:#8fc7a0} .logov .ln b.tu{color:#ff9a86} .logov .ln b i{font-style:normal;color:#6b5a48}
.logov .ln span{font-family:var(--f-mono);font-size:17px;line-height:1;color:var(--fg)}
.logov .ln.imp span{color:#ffd76a} .logov .ln.tu span{color:#ff9a86}
.logov .pz{flex:none;font-family:var(--f-display);font-size:10px;line-height:1;color:#1a1410;background:#e8b13a;text-align:center;padding:10px 0 9px;border:2px solid #9c7420}
/* canto: palavras de estado de cada um numa caixa própria */
.stw{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:none}
.stw div{background:#15110d;border:2px solid var(--line);padding:4px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}

.stw small{font-size:15px;color:var(--muted);line-height:1}
.sum span.v small,.atab span.v small{font-size:8px}
/* análise: separadores em duas linhas; COMPARAR */
.seg.sub2.two{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.seg.sub2.two button{padding:5px 2px 4px}
.cmpg{background:var(--panel2);border:2px solid var(--line);padding:6px 8px;display:grid;grid-template-columns:84px 26px 1fr 1fr 26px;gap:5px;align-items:center}

.cmpg>b{font-family:var(--f-display);font-size:8px;font-weight:400;line-height:1;color:var(--muted)}
.cmpg>b.me{color:#ff9a86;text-align:right} .cmpg>b.op{color:#9cc4ec}
.cmpg .n{font-size:18px;line-height:1}
.cmpg .hi{color:#ffd76a} .cmpg .hi:after{content:' ◆';font-size:11px}
.cmpg .v{font-family:var(--f-num);font-size:12px;line-height:1;text-align:right;color:#ff9a86} .cmpg .v.op{color:#9cc4ec;text-align:left}
.cmpg .bl,.cmpg .br{height:9px;background:#15110d;position:relative}
.cmpg .bl i{position:absolute;right:0;top:0;bottom:0;background:#d4452f} .cmpg .br i{position:absolute;left:0;top:0;bottom:0;background:#2d6db3}
.cmpk{background:var(--panel2);border:2px solid var(--line);border-left:3px solid var(--gold);padding:6px 8px;font-size:18px;line-height:1}

/* definições: pop-ups na luta */
.popdemo{display:flex;justify-content:center;gap:14px;align-items:center;padding:8px 4px;background:#1a1410;border:2px solid var(--line);min-height:40px}

.pd.n.me{color:#ff8a72}

.tks{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.card.ficha{gap:3px;padding:5px 10px}

.sg{font-family:var(--f-display);font-size:8px;color:var(--muted);letter-spacing:.06em;line-height:1.2}

/* 3A-1: treino sem plano e treinadores */

.stag.sp{color:#ef7a5f;border-color:#d4452f} .stag.si{color:var(--gold);border-color:#9c7420} .stag.so{color:#8fbbe6;border-color:var(--blue)}

.gseg button{font-size:16px;padding:6px 2px} .cbn{font-weight:400;color:var(--gold)}
.cinfo{background:none;border:0;padding:0;text-align:left;color:var(--fg);cursor:pointer;min-width:0;font:inherit}
.r .cl,.tco .cl{display:flex;gap:5px;align-items:center;font-family:var(--f-display);font-size:8px;color:var(--muted);letter-spacing:.05em;margin:2px 0 1px;white-space:nowrap}
.r.cr p{font-size:15px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .r .cl strong{display:inline;font-size:9px;color:var(--fg)} .r.cr p b{font-weight:400;color:var(--fg)}

.r.cr .cinfo{overflow:hidden}
.hire{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:none}
.hb{background:var(--panel2);border:2px solid var(--gold);color:var(--fg);padding:4px 4px 3px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0;font-family:var(--f-body)}

/* 3A-4 carreira: ranking, quadro do Rookie, prémios, caminho da carreira na Ficha */

.rkl{display:flex;gap:3px} .rkl button{background:var(--panel2);border:2px solid var(--line);color:var(--muted);font-family:var(--f-display);font-size:8.5px;padding:5px 5px 4px;cursor:pointer} .rkl button.on{color:var(--fg);border-color:var(--gold)}

.rkf{display:flex;justify-content:space-between;align-items:center;gap:6px;flex:none} .rkf .meta{font-size:15px;line-height:1}
.brc{gap:5px;padding:7px 8px} .brk{display:grid;grid-template-columns:1.15fr 1fr 1fr .95fr;gap:4px;align-items:stretch}

.awl{display:flex;flex-direction:column;gap:4px} .awl p{background:var(--panel2);border:1px solid var(--line);padding:3px 6px;font-size:16px;line-height:1.05} .awl p.me{border-color:var(--gold)}

.carp{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .carp b{color:var(--gold);font-weight:400} .carp s{opacity:.5;text-decoration:none}
.cseg.rgs{display:grid;grid-template-columns:1fr 1fr;gap:6px} .cseg.rgs .btn.on{border-color:var(--gold);color:var(--gold)}

.fh{display:flex;justify-content:space-between;align-items:baseline} .fh .meta{font-size:15px}
.foc{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.foc button{background:var(--panel2);border:2px solid var(--line);color:var(--muted);padding:4px 5px 3px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;font-family:var(--f-body);font-size:15.5px;line-height:1;min-width:0}

.wln{white-space:nowrap;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:16px;line-height:1}.wln i{font-style:normal;color:var(--muted)}.wln b{font-weight:400}.wln .warn{font-size:inherit;color:var(--red)}.wln .good{color:var(--green)}.wln .btn{flex:none;font-size:9px;padding:5px 7px 4px}
.kv.wi b{font-size:15px}
.trc>.meta{font-size:15.5px;line-height:1} .fcat b{font-weight:400;color:var(--fg)}
.imp{display:flex;flex-direction:column;gap:1px}
.imp p{display:grid;grid-template-columns:20px 1fr;font-size:16px;line-height:.98} .imp p span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .imp em{font-style:normal;color:var(--green);font-size:12px;letter-spacing:-2px}

.ccb b{font-family:var(--f-display);font-size:9px;font-weight:400} .ccb span{font-size:15.5px;color:var(--muted);line-height:1}
.ccl{display:flex;flex-direction:column;gap:5px} .ccl p{display:grid;grid-template-columns:16px 1fr;font-size:17.5px;line-height:1.05} .ccl em{font-style:normal;color:var(--gold);font-size:13px}

function lvOf(x,k){return((k in DEFS?x.def:x.skills)||{})[k]||0}
function belOf(x,k){const b=x.bel&&x.bel[k];return b==null?lvOf(x,k):b}
function belBias(x){return TUNE.belC*(mv(x,'conf')-50)/50+TUNE.belF*((x.conf??55)-55)/45}
function belUpd(x,k,ok,p){const lv=lvOf(x,k);if(!lv)return;x.bel=x.bel||{};const b=belOf(x,k),iq=x.attrs?x.attrs.iq:x.iq;
  const pe=clamp(p+TUNE.belS*(b-lv-belBias(x)),.03,.97);
  x.bel[k]=Math.round(clamp(b+TUNE.belR*(.6+clamp(iq??20,0,100)/100)*((ok?1:0)-pe),0,6)*100)/100}
function bf(b){return .4+.6*clamp(b,0,5)/3}                                           // peso da crença na escolha
function belNote(a,k){const lv=lvOf(a,k);if(!lv)return '';const b=belOf(a,k),d=b-lv;return d<=-TUNE.belNote||b<=lv*.5?'ainda não confia':d>=TUNE.belNote?'confia demais':''} // só quando a diferença é grande (ou é nova)

function techAff(x,id){const t=TECH[id];if(!t)return 0;if(t.sty==='ctr')return clamp(((x.attrs?x.attrs.iq:x.iq)-25)/60,0,1);return clamp(styleLv(x,t.sty)/5,0,1)}

function techLack(a,id){ // o que falta para poder aprender (texto curto) ou ''
  const t=TECH[id],r=t.req||{},L=[];
  for(const[k,v]of Object.entries(r.sk||{}))if((a.skills[k]||0)<v)L.push(`${pLow(k)} nv ${v}`);
  for(const[k,v]of Object.entries(r.df||{}))if(((a.def||{})[k]||0)<v)L.push(`${DEFS[k].n.toLowerCase()} nv ${v}`);
  for(const[k,v]of Object.entries(r.at||{}))if((a.attrs[k]||0)<v)L.push(`${attrLow(k)} ${v}`);
  for(const k of r.t||[])if(!knownT(a).includes(k))L.push(`saber ${TECH[k].n}`);
  return L.join(', ')}

function techSpeed(a,id){
  const t=TECH[id],c=coachOf(a);let k=TUNE.coachT[c?c.t:0]*(c?bondK(a):TUNE.noCoach);
  k*=clamp(1+TUNE.tTec*((a.attrs.tecnica||0)-30)*(t.adv?.5:1),.8,1.35);
  k*=1+TUNE.tDisc*(mv(a,'disc')-50)/50+TUNE.tConc*(mv(a,'conc')-50)/50;
  if(t.sty==='ctr')k*=clamp(1+TUNE.tIQ*((a.attrs.iq||0)-30),.85,1.3);
  else{if(c&&c.st===t.sty)k*=TUNE.tCoachSty;k*=1+TUNE.tStyLv*styleLv(a,t.sty)}

  return k*techBoost(a)}

  else if(k==='el'&&r.win)out.push(`<b class="gd">Ganhou a eliminatória:</b> é o desafiador obrigatório ao título ${RLV[L]} (n.º 1).`);

/* ================= CARDS (3A-5: cartas de treino) =================

   Campos: wk semanas (0 = efeito logo); at multiplicador do ganho diário por atributo e rest o dos outros (custo); skm experiência dos golpes e defesas,

function cardOf(a){return a&&a.cd&&CARDS[a.cd.c]?CARDS[a.cd.c]:null}
function cardAt(a,k){const c=cardOf(a);if(!c)return 1;return c.at&&c.at[k]!=null?c.at[k]:(c.rest??1)} // no ganho diário de cada atributo (attrRate)
function cardGive(id,src,msg){ // uma carta nova para o ginásio (todas as fontes passam por aqui)
  const c=CARDS[id];if(!c)return null;S.cards=S.cards||[];const x={c:id,w:S.week,s:src};S.cards.push(x);
  S.cst=S.cst||{};const n=S.cst[src]=S.cst[src]||[0,0];n[c.r]++;
  note(msg);toast(`<b>CARTA ${RAR[c.r]}</b> · ${msg}`,'',TIME.noticeMs);return x}
function awardHook(a,src,k){ // prémios grandes (Torneio Rookie, gala, títulos, vitórias contra o top 5): uma carta rara
  if(!a||!S.roster.includes(a))return;
  if(src==='rookie'||src==='gala'){const key=`${src}${yearOf()}${a.id}`;S.cawd=(S.cawd||[]).slice(-12);if(S.cawd.includes(key))return;S.cawd.push(key)} // uma rara por atleta em cada torneio/gala
  const id=src==='rookie'&&k===2?'mestre':src==='rookie'&&k===3?'lenha':pick(RARES);
  const lab={rookie:'Prémio do Torneio Rookie',gala:'Prémio da gala',title:'Título',top5:'Vitória contra o top 5'}[src]||'Prémio';
  cardGive(id,src,`${lab}: ${a.nick} ganhou para o ginásio a carta rara ${CARDS[id].n}.`)}
function fightCard(a,an){ // depois da luta o treinador vê o que faltou e dá a carta certa (mais vezes e melhor com mais escalão; raras só Lenda)
  const c=coachOf(a);if(!c||!an||Math.random()>=TUNE.cFight[c.t])return '';
  const rare=Math.random()<TUNE.cFightR[c.t];let m=null;
  let at=null; // onde a análise mostra a carta: no motivo que a pediu (w0-w2, p), na linha da pesagem (wi) ou numa linha própria
  if(an.wi&&an.wi.r==='acima'){m=CFIT.wi;at='wi'}
  const L=[...(an.why||[]).map((x,i)=>[x,'w'+i]),...(an.plus?[[an.plus,'p']]:[])].filter(([x])=>x.s<0);
  for(const[x,w]of L){if(m)break;m=x.g==='attr'?(CFIT_A[x.k]||CFIT.attr):CFIT[x.g]||null;if(m)at=w}
  if(!m){const d=CDEF[c.st]||CDEF.Puncher;m=[d[0],d[1],'está em boa fase e quer aproveitar']}
  const id=rare?m[1]:m[0],t=`${c.n} viu que o ${a.nick} ${m[2]}: carta ${CARDS[id].n}.`;
  an.cs={c:id,t:`o ${a.nick} ${m[2]}`,co:c.n,at};cardGive(id,'luta',t);
  return `<p class="hint"><b style="color:var(--gold)">${t}</b> Fica nas cartas do ginásio (Ginásio → Cartas).</p>`}
function cardFocus(a){ // fim de uma semana de treino com o foco TÉCNICAS: às vezes uma comum
  if(a.focus!=='tec'||Math.random()>=TUNE.cFoc)return null;const id=pick(COMMONS);
  return cardGive(id,'foco',`Treino de técnicas: o ${a.nick} ganhou para o ginásio a carta ${CARDS[id].n}.`)}
function cardWeek(a){ // fim de uma semana de treino com uma carta: conta a semana; no fim, os efeitos finais
  const c=cardOf(a);if(!c)return null;if(--a.cd.w>0)return null;
  const id=a.cd.c;delete a.cd;let t='';
  if(c.end){if(c.end.iq)gain(a,'iq',TUNE.iqFight*c.end.iq,1);if(c.end.rec){a.recovery=Math.max(a.recovery||0,c.end.rec);t=` Fica ${c.end.rec} semana a recuperar.`}}
  note(`${a.nick} acabou a carta ${c.n}.${t}`);return 'acabou '+c.n}
function cardResting(a){return a.injury>0||a.recovery>0}
function cardLack(a,id){ // porque não pode usar esta carta agora (ou '')
  const c=CARDS[id];if(c.need==='rest'&&!cardResting(a))return 'não está parado';
  if(c.wk&&cardOf(a))return `a fazer ${cardOf(a).n}`;
  if(c.fee&&S.money<c.fee)return `faltam ${fmt(c.fee-S.money)} €`;return ''}
function cardKg(c){return(c.kgNow||0)+(c.kg||0)*(c.wk||0)*TIME.days}
function cardUse(a,id){
  const i=(S.cards||[]).findIndex(x=>x.c===id);if(i<0||cardLack(a,id))return false;const c=CARDS[id];
  S.cards.splice(i,1);
  if(c.fee)S.money=Math.max(0,S.money-c.fee);
  if(c.conf!=null){const v=Array.isArray(c.conf)?RI(c.conf[0],c.conf[1]):c.conf;a.conf=clamp(a.conf+v,0,100)}
  if(c.fat)a.fatigue=clamp((a.fatigue||0)+c.fat,0,100);
  if(c.kgNow)a.kg=r2(a.kg+c.kgNow);
  if(c.rec){let n=c.rec;const j=Math.min(a.injury||0,n);a.injury=(a.injury||0)-j;n-=j;a.recovery=Math.max(0,(a.recovery||0)-n);a.fatigue=0}
  if(c.wk)a.cd={c:id,w:c.wk};
  SFX.play('buy');note(`${a.nick}: carta ${c.n}${c.wk?` (${c.wk} semana${c.wk>1?'s':''})`:''}.`);
  toast(`<b>${a.nick}</b> · ${c.n}${c.wk?` · ${c.wk} sem.`:''}`);return true}
function cardInfo(id){const c=CARDS[id],H=(S.cards||[]).filter(x=>x.c===id),n=H.length,src=[...new Set(H.map(x=>CSRC[x.s]||x.s))].join(', ');
  return info(c.n.toUpperCase(),`<p class="hint"><span class="tag ${c.r?'m':''}">${RAR[c.r]}</span> ${c.wk?`${c.wk} semana${c.wk>1?'s':''}`:'efeito imediato'}${n?` · tens ${n} (${src})`:''}</p>
    <p class="hint"><b class="good">Efeito:</b> ${c.d}</p><p class="hint"><b class="warn">Custo:</b> ${c.c}</p>${c.wk?'<p class="hint">Um atleta faz uma carta de cada vez. A recuperar ou lesionado, fica em pausa.</p>':''}`,'FECHAR')}
function cardPreview(a,id){ // o que esta carta faz a este atleta agora (peso, luta marcada, pausa)
  const c=CARDS[id],L=[],dk=cardKg(c);
  if(dk){const k1=r2(a.kg+dk),Lm=CAT_LIM[a.cat];L.push(`Peso: ${kgs(a.kg)} kg → cerca de ${kgs(k1)} kg${Lm!=null?` (limite ${kgs(Lm)})`:''}.`)}
  if(a.fight){const w=weeksTo(a);if(c.wk&&w<=c.wk+(c.end&&c.end.rec?1:0))L.push(`<span class="warn">A luta é daqui a ${w} semana${w===1?'':'s'}: ${c.end&&c.end.rec?'pode ter de recuperar em cima da luta':'ainda vai a meio da carta'}.</span>`);
    else if(c.fat&&w<=3)L.push(`<span class="warn">A luta é daqui a ${w} semana${w===1?'':'s'}: pode chegar cansado.</span>`);
    else if(c.kgNow&&w<=1)L.push('<span class="warn">A pesagem está à porta.</span>')}

async function cardPick(id){ // usar: escolher o atleta → confirmar com o efeito secundário
  const c=CARDS[id];if(!c||!(S.cards||[]).some(x=>x.c===id))return;
  const ord=S.roster.slice().sort((p,q)=>catIdx(p.cat)-catIdx(q.cat));
  const o=await card({title:`${c.n.toUpperCase()} · PARA QUEM?`,body:`<p class="hint">${c.s} · <span class="warn">${c.sc}</span>${c.wk?` · ${c.wk} sem.`:''}</p>`,
    opts:[...ord.map(a=>{const lk=cardLack(a,id),cd=cardOf(a);return{t:`${a.nick} · ${a.cat}<small>${lk||(cd?`a fazer ${cd.n}`:cardResting(a)?'parado':a.fight?`luta daqui a ${weeksTo(a)} sem.`:'livre')}</small>`,cls:'prep',dis:!!lk,a}}),{t:'CANCELAR'}]});
  if(!o||!o.a)return;const a=o.a;

    opts:[{t:'USAR',cls:'gold',ok:1},{t:'CANCELAR'}]});
  if(y&&y.ok&&cardUse(a,id))render()}
function cardStock(){ // Loja: comuns à venda (renova a cada estação); raras desligadas por agora (TUNE.cBuyRare)
  const s=Math.floor((S.week-1)/13);
  if(!S.csh||S.csh.s!==s){const l=[];const pool=COMMONS.slice();for(let i=0;i<TUNE.cStock&&pool.length;i++){
      const r=Math.random()<TUNE.cBuyRare;l.push(r?pick(RARES):pool.splice(RI(0,pool.length-1),1)[0])}
    S.csh={s,l,b:l.map(()=>0)}}
  return S.csh}
function cardPrice(id){return CARDS[id].r?TUNE.cBuyRareP:TUNE.cBuy}
function cardBuy(i){const st=cardStock(),id=st.l[i];if(id==null||st.b[i])return;const p=cardPrice(id);if(S.money<p)return;
  S.money-=p;st.b[i]=1;SFX.play('buy');cardGive(id,'loja',`Compraste a carta ${CARDS[id].n}.`);render()}
let cardPg=0;
function panelCards(){

function formOf(a){

/* ================= WEEK ================= */
/* ---- relógio (experiência): o tempo corre sozinho. Uma semana dura TIME.weekMs à velocidade ×1 (window.__TIME sobrepõe, para testes).
   Treino sem plano (3A-1): os atletas treinam sozinhos TODOS os dias (dayStep, um passo por dia, S.wstep 0..7); o fecho da semana (ligação ao
   treinador, estilos, idade, contas, sócios, propostas...) acontece uma só vez em weekEnd. O tempo pára sozinho quando é preciso o jogador
   (dia de luta, cartões) e nunca anda com uma janela ou uma luta abertas. dayStep devolve cartões (por agora nenhum; gancho para as técnicas
   do 3A-3). No save: S.wt (0..1, parte da semana já passada), S.wstep (dias já treinados esta semana), S.run, S.spd, S.rep (último relatório),
   S.evo (o que melhorou na última semana, caixa ESTA SEMANA), a.wk (semana em curso do atleta). ---- */
const TIME=Object.assign({
  weekMs:45000,      // duração de uma semana em ×1
  speeds:[1,2,4],    // velocidades do botão (×4 para testar mais depressa)
  days:7,            // dias de treino por semana (todos)
  resume:true,       // depois de um cartão resolvido com um toque, o tempo volta a andar se estava a andar
  offerCard:true,    // uma proposta nova pára o tempo com um cartão
  toastMs:4200,noticeMs:9000
},window.__TIME||{});
const WDAYS=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
let clkLast=0,stay=false;
const sessAt=i=>(i+.5)/TIME.days;
function toast(html,cls,ms){
  const el=$('#toasts');if(!el)return;const d=document.createElement('div');d.className='toast '+(cls||'');d.innerHTML=html;el.appendChild(d);
  while(el.children.length>5)el.firstChild.remove();
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),500)},ms||TIME.toastMs);
}
function drawClock(){

   Treinador: o escalão e a ligação (coachK) e o estilo: ensina mais depressa os golpes e defesas do seu estilo (STY_TEACH, lSpec).
   Atleta: Disciplina, Concentração e confiança do dia (qualidade do treino, sessQ) e Técnica num golpe ou defesa novos (learnK). ---- */
const STY_TEACH={'In-fighter':['ganchoF','ganchoT','upperF','upperT','cabeca','bloqueio','clinch'],'Outboxer':['jab','direto','pes','aparar'],'Puncher':['direto','ganchoT','overhand','bloqueio','ombro']};
function tecK(a){return clamp(1+TUNE.lTec*((a.attrs.tecnica||0)-TUNE.lTec0),TUNE.lTecMin,TUNE.lTecMax)}
function learnK(a,k){ // por habilidade: golpe/defesa do estilo do treinador, Técnica (só num golpe/defesa novos)
  const st=coachSty(a);return(1+(st&&STY_TEACH[st].includes(k)?TUNE.lSpec:0))*(lvOf(a,k)>0?1:tecK(a))}
function addXP(a,k,pts,up){
  if(pts<=0)return;const isD=k in DEFS,lv=isD?a.def:a.skills,xp=isD?a.dxp:a.xp;a.bel=a.bel||{};
  pts=pts*learnK(a,k); // velocidade de aprender desta habilidade (9.1)
  if(!(lv[k]>0)){if(learnLack(a,k))return;xp[k]=(xp[k]||0)+pts;
    if(xp[k]>=TUNE.learnXP){xp[k]=0;lv[k]=1;a.bel[k]=TUNE.bel0;up.push('aprendeu '+skName(k));note(`${a.nick} aprendeu: ${skName(k)}.`)}return}
  xp[k]=(xp[k]||0)+pts;
  while(lv[k]<5&&xp[k]>=lv[k]*8){xp[k]-=lv[k]*8;lv[k]++;a.bel[k]=Math.round((belOf(a,k)+TUNE.belUp)*100)/100;up.push(`${skName(k)} nv ${lv[k]}`)}
  if(lv[k]>=5)xp[k]=0;
}
function gain(a,k,base,q,mult=1){ // ganho fora do treino diário (lutas: Ring IQ)
  let g=TUNE.train*base*(.3+.9*q)*mult*discMul(a);
  g*=clamp((a.cap[k]-a.attrs[k])/20,.06,1);
  a.attrs[k]=clamp(a.attrs[k]+g,0,a.cap[k]+2);
}

const IDLE=[

let ENT=[];let occ={};
function entFor(id,kind,lk){let e=ENT.find(x=>x.id===id);if(!e){e={id,kind,lk,x:R(60,110),y:R(90,120),tx:0,ty:0,state:'idle',until:0,spot:null,face:1,t:R(0,9),doFor:0};ENT.push(e)}e.lk=lk;return e}
function syncEnt(){
  const want=new Set();
  const n=Math.min(S.members,14);
  for(let i=0;i<n;i++){const e=entFor('m'+i,'m',memberLooks[i]);want.add(e.id)}
  {const e=entFor('owner','c',OWNER);want.add(e.id)}

}
function release(e){if(e.spot&&occ[e.spot.key]===e.id)delete occ[e.spot.key];e.spot=null;e.coachOf=null}

function athleteAct(e){

function stepWorld(dt,now){

   depressa; cansado ou dorido demora mais; muito cansado e muito dorido não ouve nada enquanto estiver assim.
   Se o gongo tocar antes, ouve-te no canto, no intervalo. Uma ordem nova substitui a anterior e recomeça.

/* ---- start / pause menu ---- */
function menu(mode){
  return new Promise(res=>{
    const saved=mode==='start'?load():S;const hasSave=!!(saved&&saved.roster);
    const main=()=>{
      const m=modal(`<div class="menu"><div class="mtitle">CORNER MEN</div>
        <div class="mlogo">${logoImg((saved&&saved.logo)||0,40)}</div>
        ${mode==='start'?(hasSave?`<button class="btn gold big" id="mCont">CONTINUAR<small>${(saved.gymName||'Ginásio Esperança')} · ${calTxt(saved.week)}</small></button>`:''):`<button class="btn gold big" id="mCont">${mode==='fight'?'VOLTAR À LUTA':'VOLTAR AO JOGO'}</button>`}
        ${mode!=='fight'?`<button class="btn big ${mode==='start'&&!hasSave?'gold':''}" id="mNew">NOVO JOGO</button>`:''}
        <button class="btn" id="mSet">DEFINIÇÕES</button>
        ${mode!=='fight'?'<button class="btn" id="mHelp">COMO JOGAR</button>':''}</div>`);
      const q=id=>m.querySelector(id);
      if(q('#mCont'))q('#mCont').onclick=()=>{$('#modalRoot').innerHTML='';if(S)render();res('cont')};
      if(q('#mNew'))q('#mNew').onclick=()=>{if(!hasSave){$('#modalRoot').innerHTML='';res('new');return}
        const c=modal(`<div class="menu"><h2>COMEÇAR DE NOVO?</h2><p class="hint">Perdes todo o progresso de ${saved.gymName||'este ginásio'}.</p><div class="row2"><button class="btn" id="rNo">CANCELAR</button><button class="btn red" id="rYes">APAGAR E COMEÇAR</button></div></div>`);
        c.querySelector('#rNo').onclick=main;c.querySelector('#rYes').onclick=()=>{$('#modalRoot').innerHTML='';res('new')}};
      q('#mSet').onclick=sett;
      if(q('#mHelp'))q('#mHelp').onclick=async()=>{await help();main()};
    };
    const sett=()=>{
      const PH={all:'Palavras por cima dos pugilistas: defesas, combinações e, em destaque, as técnicas, os counters e as quedas.',esp:'<b class="chd">Só especiais:</b> ficam as técnicas, os counters e as quedas; saem as defesas e as combinações.',off:'<b class="chd">Desligados:</b> sem palavras no ringue. O Zé do Micro fala um pouco mais.'};
      const m=modal(`<div class="menu"><h2>DEFINIÇÕES</h2>
        <button class="btn big ${SFX.on?'gold':''}" id="mSnd">SOM: ${SFX.on?'LIGADO':'DESLIGADO'}</button>
        <h3>POP-UPS NA LUTA</h3>
        <div class="cseg">${[['all','TODOS'],['esp','SÓ ESPECIAIS'],['off','DESLIGADOS']].map(([k,n])=>`<button class="btn ${POPS===k?'on':''}" data-pop="${k}">${n}</button>`).join('')}</div>
        <p class="hint">${PH[POPS]}</p>
        <div class="popdemo"><span class="pd n ${POPS!=='all'?'ghost':''}">BLOQUEIO</span><span class="pd s ${POPS==='off'?'ghost':''}">COUNTER!</span><span class="pd n me ${POPS!=='all'?'ghost':''}">1-2-3</span></div>
        <button class="btn" id="mBack">VOLTAR</button></div>`);
      m.querySelector('#mSnd').onclick=()=>{SFX.setOn(!SFX.on);SFX.play('click');sett()};
      m.querySelectorAll('[data-pop]').forEach(b=>b.onclick=()=>{setPops(b.dataset.pop);SFX.play('click');if(F&&POPS!=='all'){F.pq=(F.pq||[]).filter(p=>POPS==='esp'&&p.sp);if(F.pc&&!(POPS==='esp'&&F.pc.sp))F.pc=null}sett()});
      m.querySelector('#mBack').onclick=main;
    };
    main();
  });
}
async function pauseMenu(){
  if(F){F.paused=true;const r=await menu('fight');F.paused=false;return r}
  const r=await menu('pause');
  if(r==='new'){ENT=[];occ={};newGame();render();await setupGym();render()}
}

async function start(){
  try{document.fonts&&document.fonts.ready.then(()=>{ARENA=null})}catch(e){}
  {let old=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^corner-men-v\d+$/.test(k)&&k!==KEY)old.push(k)}}catch(e){}
   if(old.length){try{old.forEach(k=>localStorage.removeItem(k))}catch(e){}
     await info('NOVA VERSÃO',`<p class="hint">O Corner Men tem regras novas: já não há plano de treino. Os atletas treinam sozinhos todos os dias e cada um tem o seu treinador, que lhe ensina o estilo dele.</p><p class="hint">Por isso o jogo recomeça do zero. O teu ginásio antigo não passa para esta versão.</p>`,'COMEÇAR')}}

  S.reg=S.reg||0;S.hof=S.hof||[];for(const a of S.roster)carK(a);
  S.cards=(Array.isArray(S.cards)?S.cards:[]).filter(x=>x&&CARDS[x.c]);for(const a of S.roster)if(a.cd&&!cardOf(a))delete a.cd; // cartas (3A-5)
  for(const a of S.roster){normSkills(a);a.combos=a.combos||knownCombos(a).map(c=>c.id);a.recovery=a.recovery||0;a.ment=a.ment||rollMental();for(const[k]of ATTRS){if(a.attrs[k]==null)a.attrs[k]=k==='queixo'?50:10;if(a.cap[k]==null)a.cap[k]=a.attrs[k]+5}if(a.gift===undefined){a.gift=null;a.giftKnown=true}a.weeks=a.weeks||0}
  if(!Array.isArray(S.coaches)){S.coaches=startCoaches();for(const a of S.roster){a.coach=null;autoCoach(a)}} // treinadores (3A-1)
  for(const a of S.roster){const T=techK(a);T.k=T.k.filter(k=>TECH[k]);if(T.l&&!TECH[T.l])T.l=null;if(T.fg&&!T.k.includes(T.fg))T.fg=null; // técnicas (3A-3)
    if(!FOCUS[a.focus])a.focus='attrs';a.cw=a.cw||0;if(a.coach&&!coachOf(a))a.coach=null;for(const k of['plan','padF','ovr','wcd','tlog','lastT','peak'])delete a[k]}
  for(const a of S.roster){if(!CATS.includes(a.cat)){const OLD={Ligeiro:'Leve',Superpena:'Pena'};let c=OLD[a.cat]||'Leve'; // saves de teste com as 4 categorias antigas
    if(S.roster.some(x=>x!==a&&x.cat===c))c=CATS.find(k=>!S.roster.some(x=>x.cat===k))||c;a.cat=c;a.icat=null;a.nw=null}initWeight(a)}

  S.tab=S.tab||'gym';
  S.run=false;S.spd=TIME.speeds.includes(S.spd)?S.spd:1;S.wt=clamp(+S.wt||0,0,1);S.wstep=clamp(S.wstep|0,0,TIME.days);for(const a of S.roster)delete a.revWeek; // relógio: começa sempre parado
  render();requestAnimationFrame(world);clkLast=performance.now();setInterval(clockTick,100);
  if(fresh){await setupGym();render()}

}

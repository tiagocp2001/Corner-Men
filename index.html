<!doctype html><html><head><meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" href="icons/icon-192.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Corner Men</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Layout: one fixed phone screen — HUD, gym window, switchable panel, bottom menu. Nothing scrolls the page. */
:root{
  --bg:#17130f; --panel:#231c16; --panel2:#2e251d; --line:#463a2d;
  --fg:#f1e5d0; --muted:#a8957d; --red:#d4452f; --gold:#e8b13a; --blue:#5b8fc4; --green:#74b35d;
  --f-display:'Press Start 2P', ui-monospace, monospace;
  --f-body:'Pixelify Sans', system-ui, sans-serif;
  --f-mono:'VT323', ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
*{font-variant-ligatures:none} /* a Pixelify Sans desenha o "fi" como um A (In-fighter) */
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.3;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px 0}
h2,h3{font-family:var(--f-display);font-weight:400;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:11px;line-height:1.6}
h3{font-size:8px;color:var(--muted);letter-spacing:.1em}
p{margin:0}
.hud{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:5px;flex:none}
.hud div{background:var(--panel);border:2px solid var(--line);padding:4px 6px;min-width:0}
.hud small{display:block;font-family:var(--f-display);font-size:6px;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
.hud b{font-family:var(--f-mono);font-size:20px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.screen{position:relative;border:3px solid #0b0907;outline:2px solid var(--line);background:#000;line-height:0;flex:none}
canvas.px{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.tagl{position:absolute;left:5px;top:5px;line-height:1;font-family:var(--f-display);font-size:7px;background:rgba(0,0,0,.65);color:var(--fg);padding:4px 5px}
.dayover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;gap:6px;line-height:1;pointer-events:none}
.dayover b{font-family:var(--f-display);font-size:11px;background:rgba(0,0,0,.7);padding:6px 8px;color:var(--gold);font-weight:400}
.skip{position:absolute;right:5px;bottom:5px;line-height:1}
.panel{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.scrolly{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:6px}
.nav{flex:none;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;gap:4px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.nav button{background:var(--panel);border:2px solid var(--line);color:var(--muted);font-family:var(--f-display);font-size:7px;padding:12px 2px 10px;cursor:pointer;line-height:1.4;position:relative}
.nav button.on{color:var(--fg);border-color:var(--gold);background:var(--panel2)}
.nav button.go{background:var(--gold);color:#1b140c;border-color:#9c7420;border-bottom-width:4px}
.nav button.go:disabled{opacity:.5}
.nav button.go.fightgo{background:var(--red);border-color:#8f2a1b;color:#fff}
.badge{position:absolute;top:-6px;right:-3px;background:var(--red);color:#fff;font-size:7px;padding:3px 4px;font-family:var(--f-display)}
/* relógio: tempo a correr sozinho (▶ / pausa, ×1 / ×2), dias da semana por cima do ginásio, avisos curtos e cartões */
.nav .clkb{display:grid;grid-template-columns:1.5fr 1fr;gap:3px;min-width:0}
.nav .clkb button{padding:0;min-width:0;display:flex;align-items:center;justify-content:center}
.nav .clkb button.fightgo{grid-column:1/-1;padding:12px 2px 10px}
.nav button.go.run{background:var(--panel2);color:var(--gold);border-color:var(--gold)}
.nav button.spd{color:var(--fg);font-size:8px} .nav button.spd.x2{color:var(--gold);border-color:var(--gold)}
.icp{display:block;width:0;height:0;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent currentColor}
.icpa{display:block;width:12px;height:14px;border-left:4px solid currentColor;border-right:4px solid currentColor;box-sizing:border-box}
.days{position:absolute;left:5px;top:5px;right:54px;z-index:2;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;line-height:1;pointer-events:none}
.days i{position:relative;font-style:normal;font-family:var(--f-display);font-size:6px;color:#9c8a70;background:rgba(0,0,0,.7);padding:5px 0 4px;text-align:center;overflow:hidden}
.days i u{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(232,177,58,.5);text-decoration:none}
.days i span{position:relative}
.days i.tr::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--red)}
.days i.dn{color:var(--fg)} .days i.now{color:#fff}
.days.off i u{background:rgba(170,160,145,.35)}
.toasts{position:absolute;left:5px;right:5px;top:23px;z-index:2;display:flex;flex-direction:column;gap:3px;align-items:flex-start;pointer-events:none;line-height:1.05}
.toast{max-width:100%;box-sizing:border-box;font-family:var(--f-mono);font-size:16px;background:rgba(10,8,6,.88);border-left:3px solid var(--gold);color:var(--fg);padding:3px 7px;animation:tin .25s steps(3);transition:opacity .5s}
.toast b{font-weight:400;color:var(--gold)} .toast .warn{font-size:inherit}
.toast.wk{align-self:stretch;border:1px solid var(--gold);border-left-width:3px;padding:4px 7px}
.toast.wk div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.out{opacity:0}
@keyframes tin{from{transform:translateX(-12px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.cardb{display:flex;flex-direction:column;gap:6px}
.cardb .btn small{display:block;font-family:var(--f-body);font-size:12px;letter-spacing:0;margin-top:3px;opacity:.85}
#pauseBtn{font-size:7px!important}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;flex:none}
.seg button{background:var(--panel);border:2px solid var(--line);color:var(--muted);padding:6px 4px;font-family:var(--f-body);font-size:13px;cursor:pointer;min-width:0;line-height:1.2}
.seg button b{display:block;font-family:var(--f-display);font-size:6px;letter-spacing:.08em;margin-bottom:2px;font-weight:400}
.seg button.on{background:var(--panel2);color:var(--fg);border-color:var(--gold)}
.seg button:disabled{opacity:.45}
.card{background:var(--panel);border:2px solid var(--line);padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.who{display:flex;gap:10px;align-items:center}
.who canvas{width:48px;height:48px;image-rendering:pixelated;border:2px solid var(--line);background:#3a2d22;flex:none}
.nm{font-family:var(--f-display);font-size:9px;line-height:1.5}
.nm em{font-style:normal;color:var(--gold)}
.meta{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:2px solid var(--line);padding:1px 5px;font-size:12px;background:var(--panel2)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.chip.lock{opacity:.5}
.stats{display:grid;gap:3px}
.stat{display:grid;grid-template-columns:78px 1fr 26px;gap:7px;align-items:center;font-size:13px}
.bar{height:8px;background:#120e0b;border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.bar.red i{background:var(--red)} .bar.gold i{background:var(--gold)} .bar.blue i{background:var(--blue)} .bar.green i{background:var(--green)}
.num{font-family:var(--f-mono);font-size:18px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.warn{color:var(--red);font-size:13px}
.good{color:var(--green)}
.btn{background:var(--panel2);color:var(--fg);border:2px solid var(--line);border-bottom-width:4px;font-family:var(--f-display);font-size:8px;padding:10px 6px 8px;cursor:pointer;line-height:1.5;text-align:center}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.red{background:var(--red);border-color:#8f2a1b;color:#fff}
.btn.gold{background:var(--gold);border-color:#9c7420;color:#1b140c}
.btn.big{font-size:10px;padding:14px 8px 12px;width:100%}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:8px 10px;cursor:pointer;color:var(--fg);text-align:left;font-family:var(--f-body);font-size:14px}
.slot .n{font-family:var(--f-display);font-size:10px;color:var(--gold)}
.slot strong{display:block;font-family:var(--f-display);font-size:8px;font-weight:400;margin-bottom:3px;line-height:1.5}
.slot span.meta{font-size:12px}
.slot em{font-style:normal;font-family:var(--f-display);font-size:7px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:5px}
.r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:6px 8px;min-width:0}
.r strong{font-family:var(--f-display);font-size:7px;font-weight:400;line-height:1.6;display:block}
.r p{font-size:12px;color:var(--muted)}
.r .btn{font-size:7px;padding:8px 6px 6px;white-space:nowrap}
.log{background:#0f0c09;border:2px solid var(--line);padding:6px 8px;font-family:var(--f-mono);font-size:17px;line-height:1.05;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;flex:1}
.log span:first-child{color:var(--fg)}
.log b{color:var(--gold);font-weight:400}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.kv div{background:var(--panel);border:2px solid var(--line);padding:5px 7px}
.kv small{display:block;font-family:var(--f-display);font-size:6px;color:var(--muted);letter-spacing:.08em;margin-bottom:3px}
.kv b{font-family:var(--f-mono);font-size:19px;font-weight:400;line-height:1}
.empty{color:var(--muted);font-size:14px;padding:8px 2px}
.tag{font-size:11px;padding:0 5px;border:2px solid var(--line)}
.tag.g{color:var(--green);border-color:var(--green)} .tag.b{color:var(--red);border-color:var(--red)} .tag.m{color:var(--gold);border-color:var(--gold)}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(8,6,4,.8);display:flex;align-items:flex-end;justify-content:center;z-index:90;padding-top:max(10px,env(safe-area-inset-top,0px))}
.sheet{background:var(--panel);border:3px solid var(--line);border-bottom:none;width:100%;max-width:540px;max-height:100%;overflow:auto;
  padding:14px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;animation:up .16s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.hint{color:var(--muted);font-size:14px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pick button{background:var(--panel2);border:2px solid var(--line);color:var(--fg);padding:8px 5px;cursor:pointer;text-align:left;font-family:var(--f-body);font-size:12px;line-height:1.2;min-height:62px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pick button strong{font-family:var(--f-display);font-size:7px;font-weight:400;line-height:1.5}
.pick button span{color:var(--muted)}
.pick button.on{border-color:var(--gold)}
.pick button:disabled{opacity:.4}
.lossw{color:var(--gold)} .lossr{color:var(--red)} .mini small .lossw,.mini small .lossr{font-size:9px}
.plancard{gap:3px;padding:7px 9px;font-size:12px;overflow:auto;min-height:0} .plancard .meta,.plancard .warn{font-size:12px;line-height:1.3}
.planbox{grid-template-columns:1fr auto!important;padding:9px 10px!important}
.planbox .pl{display:block;font-size:14px;color:var(--fg);margin-top:2px}
.planbox em.ed{font-style:normal;font-family:var(--f-display);font-size:7px;color:#1b140c;background:var(--gold);padding:7px 8px;line-height:1.5;text-align:center}
.plan3{grid-template-columns:repeat(3,1fr)}
.plan3 .slot{grid-template-columns:1fr;gap:3px;padding:6px 7px;align-content:start;min-width:0}
.plan3 .slot .n{font-size:6px;color:var(--muted)}
.plan3 .slot strong{margin:0}
.plan3 .slot span.meta{font-size:11px;line-height:1.25}
.panel .card .btn.keep{padding:6px;font-size:7px}
.seg .wk{font-size:10px;opacity:.85}
.seg.sub2 button{padding:4px;font-family:var(--f-display);font-size:7px;letter-spacing:.06em}
.txt{width:100%;background:var(--panel2);border:2px solid var(--line);color:var(--fg);font-family:var(--f-body);font-size:16px;padding:8px}
.txt:focus{outline:none;border-color:var(--gold)}
.logos{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.logos button{background:var(--panel2);border:2px solid var(--line);color:var(--muted);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--f-display);font-size:7px;cursor:pointer}
.logos button.on{border-color:var(--gold);color:var(--fg)}
.tagl img{margin:-2px 2px 0 0}
.snd{position:absolute;right:5px;top:5px;z-index:3;background:rgba(0,0,0,.65);color:var(--fg);border:1px solid rgba(255,255,255,.2);font-family:var(--f-display);font-size:7px;line-height:1;padding:5px 6px;cursor:pointer}
.stage .snd{top:auto;bottom:5px;right:5px}
.stys{display:flex;flex-direction:column;gap:4px}
.sty{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);padding:4px 6px;font-size:12px}
.sty.on{border-color:var(--gold)}
.sty b{font-family:var(--f-display);font-size:7px;font-weight:400}
.skc{min-height:0;gap:4px;padding:6px 8px;overflow:hidden}
.skg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.skg h3{margin-bottom:2px}
.skr{display:flex;justify-content:space-between;align-items:center;gap:4px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font-family:var(--f-body);font-size:12px;line-height:1.2;padding:2px 0;cursor:pointer;text-align:left;min-width:0}
.skr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.skr.lock{color:var(--muted);opacity:.65}
.skr .pp{display:flex;gap:1px;flex:none}.skr .pp b{width:6px;height:6px;background:#3a2d22;border:1px solid #5a4632}.skr .pp b.f{background:var(--gold);border-color:var(--gold)}
.skr em,.sknote em{font-style:normal;margin-right:2px}.cfu{color:var(--gold)}.cfo{color:#ff7a66}
.sknote{font-size:11px;line-height:1.25;color:var(--muted)}
.pips{display:flex;gap:2px;margin:2px 0}.pips i{width:12px;height:5px;background:#3a2d22;border:1px solid #5a4632}.pips i.f{background:var(--gold);border-color:var(--gold)}.pips i.x{opacity:.25}
.menu{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center;padding:6px 0}
.menu .mtitle{font-family:var(--f-display);font-size:22px;color:var(--gold);letter-spacing:.06em;text-shadow:3px 3px 0 #8f2a1b;margin:6px 0 2px}
.menu .mlogo{display:flex;justify-content:center;margin-bottom:6px}
.menu .btn small{display:block;font-family:var(--f-body);font-size:12px;letter-spacing:0;margin-top:4px;opacity:.85}
.snd{font-size:9px!important;padding:5px 7px!important}
.rdot{position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--red);border-radius:50%}
.sumr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:6px 8px}
.fatbox{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;background:var(--panel2);border:2px solid var(--line);padding:6px 8px}
.fatbox .fl{display:flex;flex-direction:column;gap:3px}
.fatbox small{font-family:var(--f-display);font-size:6px;color:var(--muted);letter-spacing:.06em}
.fatbox b{font-family:var(--f-mono);font-size:20px;font-weight:400;line-height:1}
.fatbox p{grid-column:1/-1;font-size:12px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.mini div{background:var(--panel2);border:2px solid var(--line);padding:4px 3px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mini small{font-family:var(--f-display);font-size:6px;color:var(--muted);letter-spacing:.06em}
.mini b{font-family:var(--f-mono);font-size:20px;font-weight:400;line-height:1}
.mini .low{border-color:var(--red)} .mini .low small{color:var(--red)}
.pick button em{font-style:normal;color:var(--gold);font-size:12px}
.pick2{grid-template-columns:repeat(2,1fr)}.pick2 button{min-height:46px}
.slot.padf{border-color:var(--gold);padding:6px 10px}
.rep{display:flex;flex-direction:column;gap:6px}
.rep .r{grid-template-columns:1fr}
.rep .r p{color:var(--fg);font-size:13px}
.stars{color:var(--gold);letter-spacing:1px}
.talent canvas{width:84px;height:84px;image-rendering:pixelated;border:2px solid var(--line);background:#3a2d22;align-self:center}
.quote{font-size:14px;color:var(--muted);text-align:center;font-style:italic}

/* fight */
.fight{position:fixed;inset:0;z-index:70;background:#0c0a08;display:flex;flex-direction:column;gap:6px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.fight>*{max-width:520px;width:100%;margin:0 auto}
.fight .bar i.v{transition:width .7s ease}
.fight .bar i.pv{position:absolute;top:0;bottom:0;width:0}
.fight .bar.gold i.pv{background:rgba(255,236,170,.65)} .fight .bar.red i.pv{background:rgba(255,170,150,.65)}
.fight .fside.rt .bar i.pv{display:none}
.fhead{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;flex:none}
.fside{display:flex;flex-direction:column;gap:3px;min-width:0}
.fside.rt{text-align:right}
.fside.rt .bar i{left:auto;right:0}
.fname{font-family:var(--f-display);font-size:7px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fclock{text-align:center;font-family:var(--f-display);font-size:7px;color:var(--muted);line-height:1.8}
.fclock b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:400;color:var(--fg);line-height:1}
.booth{display:grid;grid-template-columns:1fr 74px;gap:6px;flex:none;height:64px;min-height:0}
.booth.big{flex:1;height:auto;grid-template-columns:1fr 34%}
.fcom{background:#0f0c09;border:2px solid var(--line);padding:5px 8px;font-family:var(--f-mono);font-size:18px;line-height:1.05;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;overflow:hidden;min-height:0}
.booth.big .fcom{font-size:18px;gap:5px;padding:8px 10px}
.caster{background:#1a1410;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;min-height:0;overflow:hidden}

  }

    <div class="meta">Nível ${level()} da academia: sobe com popularidade 30 e 70 e dá mais lugares.</div></div>`;

function lockReason(a,k){ // porque ainda não sabe (ou como se aprende)
  const lack=learnLack(a,k);if(lack)return lack;
  if(k in SKILLS){if(!S.eq.pads)return 'precisa de pads';return (a.xp[k]||0)>0?'a aprender nos pads':'escolhe-o nos pads'}
  if(k==='clinch')return 'resistência 20';
  return (a.dxp[k]||0)>0?'a aprender':'aprende-se com '+DEF_TR[k].toLowerCase().replace(/ e /,' ou ');
}
function skillInfo(a,k){ // detalhe de um golpe ou defesa (toque na Ficha)
  const isD=k in DEFS,lv=lvOf(a,k),xp=(isD?a.dxp:a.xp)[k]||0,nt=belNote(a,k);
  const what=isD?{bloqueio:'Serve contra tudo um pouco, sobretudo ganchos e golpes ao corpo. Seguro, mas deixa passar algum dano e quase não abre counters.',
    aparar:'Desvia golpes retos (jab e direto) com um toque da luva. Não serve contra ganchos. Abre counters de 1 ou 2.',
    cabeca:'Slip contra os retos e pendular contra ganchos e overhand. Abre os melhores counters, mas gasta fôlego e piora com o cansaço.',
    ombro:'O golpe resvala no ombro e a mão de trás fica livre: ótimo para contra-atacar com o 2 por cima. Precisa de Ring IQ; se falha, o golpe entra em cheio.',
    pes:'Recuar, pivô e passo lateral: evita combinações inteiras. Usa o atributo Pés e gasta fôlego.',
    clinch:'Agarrar quando está magoado ou cansado: trava o ataque e recupera um pouco. O árbitro separa e os juízes não gostam.'}[k]
    :{jab:'Mão da frente, reto. Rápido e seguro: marca pontos e mede a distância.',direto:'Mão de trás, reto. O golpe de poder mais usado.',ganchoF:'Mão da frente, em arco. Ao corpo é o gancho ao fígado.',
    ganchoT:'Mão de trás, em arco. Muito pesado, mas mais lento.',upperF:'Mão da frente, de baixo para cima. Entra por baixo da guarda.',upperT:'Mão de trás, de baixo para cima. Perigoso a curta distância.',
    overhand:'Mão de trás em arco por cima da guarda. Arriscado e cansativo, mas derruba.'}[k];
  const pe=!isD&&lv<5&&S.eq.pads&&!learnLack(a,k)?(()=>{const n=padSess(a,k);return ` Ao ritmo de ${a.nick}: ${lv?'nível '+(lv+1):'aprende-o'} em ~${n} sess${n>1?'ões':'ão'} de Pads.`})():'';
  const how=isD?`Treina-se com ${DEF_TR[k]}.`:`Aprende-se e sobe nos Pads (escolhe-o como golpe da semana).${pe} Também sobe um pouco com ${SK_TR[k]} e com o Sparring, se o usar nas lutas.`;
  const st=lv?`Nível ${lv}${lv<5?` · ${Math.floor(xp)}/${lv*8} para o nível ${lv+1}`:' (máximo)'}`:`Ainda não sabe: ${lockReason(a,k)}.${xp?` Progresso ${Math.floor(xp)}/${TUNE.learnXP}.`:''}`;
  const cf=!lv?'':nt==='ainda não confia'?'Ainda não confia neste '+(isD?'recurso':'golpe')+': usa-o menos do que podia. O Sparring e as lutas dão-lhe confiança.':nt==='confia demais'?'Confia demais: usa-o mais do que devia. As lutas acabam por o pôr no sítio.':'Confia no que sabe fazer.';
  return info((isD?DEFS[k].n:pName(k)).toUpperCase(),`<p class="hint"><b style="color:var(--gold)">${st}</b></p><p class="hint">${what}</p><p class="hint">${how}</p>${cf?`<p class="hint">${cf}</p>`:''}`,'FECHAR');
}
function formOf(a){
  const RS=[];let sc=0;const add=(v,t)=>{sc+=v;if(Math.abs(v)>=.08)RS.push([v,t])};
  if(a.fatigue>50)add(-(a.fatigue-50)/50,'chega cansado');else if(a.fatigue<20)add(.15,'chega fresco');
  const L=(a.tlog||[]).slice(-4);const avg=L.length?L.reduce((t,x)=>t+x.n,0)/L.length:2;
  if(L.length>=3&&avg>=2)add(.25,'treinou com regularidade');else if(avg<1)add(-.35,'treinou pouco nas últimas semanas');
  const last=L.at(-1);if(last&&last.rest&&last.n>0)add(.15,'aliviou na última semana');
  const lostN=DECAY_K.filter(k=>a.peak&&a.attrs[k]<a.peak[k]-1.5).length;if(lostN)add(-.15*lostN,'perdeu condição física');
  add((a.conf-55)/150,a.conf>=55?'confiante':'com pouca confiança');
  if(a.recovery>0)add(-.4,'ainda não recuperou da última luta');
  sc=clamp(sc,-1,1);
  return{sc,label:sc>=.3?'Em grande forma':sc<=-.3?'Fora de forma':'Normal',cls:sc>=.3?'good':sc<=-.3?'warn':'',reasons:RS.sort((x,y)=>Math.abs(y[0])-Math.abs(x[0])).map(x=>(x[0]>0?'+ ':'− ')+x[1])};
}
function revealGift(a,why){
  if(a.giftKnown)return '';a.giftKnown=true;
  let m;
  if(a.gift)m=`Descobriste ${why} que ${a.nick} tem um dom: ${GIFTS[a.gift].n}!`;
  else if(a.hint)m=`Afinal ${a.nick} não tem nada de especial: a pista sobre ${GIFTS[a.hint].n.toLowerCase()} era falsa.`;
  else return '';
  note(m);return m;
}
function checkUnlocks(a){ // o clinch vem por instinto (Resistência 20); os golpes aprendem-se nos Pads e as defesas nos treinos (addXP)
  const out=[];
  if(!a.def.clinch&&!learnLack(a,'clinch')){a.def.clinch=1;a.bel=a.bel||{};a.bel.clinch=TUNE.bel0;out.push('Clinch')}
  a.combos=a.combos||[];
  for(const c of knownCombos(a))if(!a.combos.includes(c.id)){a.combos.push(c.id);out.push('combinação '+c.n)}
  for(const g of out)note(`${a.nick} aprendeu: ${g}.`);
  return out;
}

function projFat(a,plan){const n=wkDone(a);let f=n?a.fatigue:Math.max(0,a.fatigue-15);for(const p of plan.slice(n)){/* a meio da semana: só os treinos que faltam */const t=TR[trainOK(a,p)?p:'corrida'];f=clamp(f+(t.f>0?t.f*fatMul(a):t.f),0,100)}return Math.round(f)}
function losing(a,k){
  if(!DECAY_K.includes(k)||!a.lastT||a.lastT[k]===undefined)return null;
  const d=S.week-a.lastT[k];if(d<3)return null;
  const base=(a.base&&a.base[k])||0,peak=(a.peak&&a.peak[k])||a.attrs[k];
  const floor=Math.max(base,peak*TUNE.decayFloor),lost=Math.max(0,peak-a.attrs[k]);
  if(a.attrs[k]<=floor+.05)return null;
  return {lvl:d>=4?'red':'warn',lost};
}
function lossMark(a,k){const l=losing(a,k);if(!l)return '';
  return l.lvl==='red'?` <span class="lossr" title="perde condição no fim desta semana se não treinar${l.lost>.05?' (já perdeu '+l.lost.toFixed(1)+')':''}">↓</span>`
  :` <span class="lossw" title="começa a perder condição se continuar sem treino">↓</span>`}

  return `<div class="fatbox"><div class="fl"><small>FADIGA AGORA</small><b>${now}</b><div class="bar ${col(now)}"><i style="width:${now}%"></i></div></div><div class="fl"><small>FIM DA SEMANA</small><b class="${end>70?'warn':''}">≈${end}</b><div class="bar ${col(end)}"><i style="width:${end}%"></i></div></div><p>${end>70?'Acima de 70: risco de lesão.':end>45?'Cansado: treina menos bem e chega pior às lutas.':'Bom nível de fadiga.'}</p></div>`}
function miniStats(a){

/* ================= WEEK ================= */
/* ---- relógio (experiência): o tempo corre sozinho. Uma semana dura TIME.weekMs à velocidade ×1 (window.__TIME sobrepõe, para testes).
   Os 3 treinos do plano resolvem-se ao longo da semana (TIME.sessDays: Seg, Qua, Sex) em sessionStep; o fecho da semana (condição física,
   anos, contas, sócios, propostas...) acontece uma só vez em weekEnd. O tempo pára sozinho quando é preciso o jogador (dia de luta, cartões)
   e nunca anda com uma janela ou uma luta abertas. O plano é uma ordem permanente: só aparece um cartão quando há motivo (planAlerts).
   No save: S.wt (0..1, parte da semana já passada), S.wstep (treinos já feitos esta semana), S.run, S.spd, S.wchk (semana em que os avisos
   do plano já foram vistos), S.rep (último relatório), a.wk (semana em curso do atleta), a.ovr (plano só desta semana), a.wcd (avisos em espera). ---- */
const TIME=Object.assign({
  weekMs:45000,      // duração de uma semana em ×1
  speeds:[1,2],      // velocidades do botão
  sessDays:[0,2,4],  // dias dos 3 treinos (0 = Seg)
  resume:true,       // depois de um cartão resolvido com um toque, o tempo volta a andar se estava a andar
  offerCard:true,    // uma proposta nova pára o tempo com um cartão
  warnCd:4,          // semanas sem repetir um aviso do plano depois de "MANTER"
  easeCd:2,          // semanas sem repetir depois de aceitar a sugestão ou de ir mudar o plano
  toastMs:4200,noticeMs:9000
},window.__TIME||{});
const WDAYS=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
let clkLast=0,stay=false;
const sessAt=i=>(TIME.sessDays[i]+.5)/7;
function weekPlan(a){return a.ovr&&a.ovr.w===S.week?a.ovr.p:a.plan}          // o plano desta semana (pode estar aliviado só esta semana)
function wkDone(a){return a.wk&&a.wk.w===S.week?(S.wstep||0):0}               // treinos desta semana que já passaram
function toast(html,cls,ms){
  const el=$('#toasts');if(!el)return;const d=document.createElement('div');d.className='toast '+(cls||'');d.innerHTML=html;el.appendChild(d);
  while(el.children.length>5)el.firstChild.remove();
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),500)},ms||TIME.toastMs);
}
function drawClock(){
  const el=$('#days');if(!el||!S)return;
  if(el.children.length!==7)el.innerHTML=WDAYS.map((d,i)=>`<i class="${TIME.sessDays.includes(i)?'tr':''}"><u></u><span>${d}</span></i>`).join('');
  const t=clamp(S.wt||0,0,1)*7;el.classList.toggle('off',!S.run);
  for(let i=0;i<7;i++){const c=el.children[i];c.firstChild.style.width=clamp(t-i,0,1)*100+'%';c.classList.toggle('dn',t>=i+1);c.classList.toggle('now',t>=i&&t<i+1)}
}
function clockHeld(){return busy||!!F||document.hidden||!!$('#modalRoot').innerHTML||!!$('#fightRoot').innerHTML}
function clockTick(){
  const now=performance.now(),dt=Math.min(250,now-clkLast);clkLast=now;
  if(!S)return;
  if(S.run&&!clockHeld())clockAdvance(dt*(S.spd||1)/TIME.weekMs);
  drawClock();
}
function clockAdvance(d){
  if(anyFightNow()){S.run=false;render();return}
  if(S.wchk!==S.week&&!(S.wt>0)){S.wchk=S.week;const c=S.roster.flatMap(planAlerts);if(c.length){clockDo(()=>runCards(c));return}} // avisos do plano: uma vez, no início da semana
  S.wt=(S.wt||0)+d;
  let cards=[],did=false;
  while((S.wstep||0)<3&&S.wt>=sessAt(S.wstep||0)&&!cards.length){cards=sessionStep();did=true}
  if(cards.length){clockDo(()=>runCards(cards));return}
  if(S.wt>=1){clockDo(()=>endWeek());return}
  if(did)render();
}
async function clockDo(fn){ // um passo com janelas: o tempo fica parado e só volta a andar se nada ficou por decidir
  busy=true;stay=false;const was=S.run;render();
  try{await fn()}finally{busy=false}
  S.run=!!was&&TIME.resume&&!stay&&!anyFightNow();
  if(anyFightNow()&&was)toast('<b>DIA DE LUTA</b>','wk');
  render();
}
function card(c){ // cartão curto com escolhas de um toque: {title, body, opts:[{t, cls, fn, stay}]}
  return new Promise(res=>{
    const m=modal(`<h2>${c.title}</h2>${c.body}<div class="cardb">${c.opts.map((o,i)=>`<button class="btn ${o.cls||''}" data-card="${i}">${o.t}</button>`).join('')}</div>`);
    m.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const o=c.opts[+b.dataset.card];closeModal();if(o.stay)stay=true;if(o.fn)o.fn();res(o)});
  });
}
async function runCards(cards){for(const c of cards){if(c.a&&!S.roster.includes(c.a))continue;await card(c);if(stay)break}}
function openPlan(a){const i=S.roster.indexOf(a);if(i<0)return;S.tab='ath';S.sel=i;S.sub='plano';render();editPlan(a)}
function setCd(a,k,n){a.wcd=a.wcd||{};a.wcd[k]=S.week+n}
function easePlan(a,lim){ // troca os treinos mais pesados por descanso até a fadiga prevista caber no limite
  const p=[...weekPlan(a)],out=[],fOf=id=>TR[trainOK(a,id)?id:'corrida'].f;
  while(projFat(a,p)>lim){let bi=-1;p.forEach((id,i)=>{if(id!=='descanso'&&(bi<0||fOf(id)>fOf(p[bi])))bi=i});if(bi<0)break;out.push(TR[p[bi]].n);p[bi]='descanso'}
  return{p,out};
}
/* avisos do plano: só quando há motivo (fadiga alta, luta na próxima semana, condição física a descer). Quem escolhe MANTER não volta a
   ser avisado do mesmo durante TIME.warnCd semanas. */
function planAlerts(a){
  const out=[];if(!canTrain(a))return out;
  const pl=weekPlan(a),end=projFat(a,pl),w=weeksTo(a),A=a.nick.toUpperCase();
  const mk=(key,title,txt,act)=>{if(a.wcd&&a.wcd[key]>S.week)return;
    out.push({a,title,body:`<p class="hint">${txt}</p>`,opts:[
      ...(act?[{t:act.t,cls:'gold',fn:()=>{a.ovr={w:S.week,p:act.p};setCd(a,key,TIME.easeCd)}}]:[]),
      {t:'MUDAR O PLANO',stay:true,fn:()=>{setCd(a,key,TIME.easeCd);openPlan(a)}},
      {t:'MANTER',fn:()=>setCd(a,key,TIME.warnCd)}]})};
  if(end>70){const e=easePlan(a,70);
    mk('fat',`${A} ESTÁ MUITO CANSADO`,`Fadiga ${Math.round(a.fatigue)} agora e ≈${end} no fim da semana com este plano. Acima de 70 há risco de lesão.`,
      e.out.length?{t:`ALIVIAR ESTA SEMANA<small>${e.out.join(' e ')} → Descanso, só esta semana</small>`,p:e.p}:null)}
  else if(a.fight&&w===1&&end>45){const e=easePlan(a,45);
    mk('fight',`${A} LUTA NA PRÓXIMA SEMANA`,`Luta com ${a.fight.opp.nick} daqui a 1 semana e, com este plano, chega cansado (fadiga ≈${end}).`,
      e.out.length?{t:`ALIVIAR ESTA SEMANA<small>${e.out.join(' e ')} → Descanso, só esta semana</small>`,p:e.p}:null)}
  const trained=new Set(pl.filter(p=>trainOK(a,p)).flatMap(p=>Object.keys(TR[p].g)));
  if(pl.some(p=>!trainOK(a,p)))trained.add('resistencia');
  const lost=DECAY_K.filter(k=>{const l=losing(a,k);return l&&l.lvl==='red'&&!trained.has(k)});
  if(lost.length){
    const val=id=>lost.reduce((t,k)=>t+(TR[id].g[k]||0),0),nid=Object.keys(TR).filter(id=>trainOK(a,id)&&val(id)>0).sort((x,y)=>val(y)-val(x))[0];
    let act=null;
    if(nid){const tot=id=>Object.values(TR[trainOK(a,id)?id:'corrida'].g).reduce((t,v)=>t+v,0);let si=-1;pl.forEach((id,i)=>{if(si<0||tot(id)<=tot(pl[si]))si=i});
      if(si>=0){const p=[...pl];p[si]=nid;if(projFat(a,p)<=70)act={t:`TREINAR ESTA SEMANA<small>${TR[pl[si]].n} → ${TR[nid].n}, só esta semana</small>`,p}}}
    mk('dec:'+lost.join(),`${A} VAI PERDER CONDIÇÃO`,`Há 4 semanas sem treinar ${lost.map(k=>ATTRS.find(x=>x[0]===k)[1]).join(' e ')}: desce no fim desta semana se não treinar.`,act)}
  return out;
}

/* ---- um treino do plano (o n.º S.wstep desta semana) para todos os atletas; devolve os cartões que precisam do jogador ---- */
function beginWeek(a){
  a.wk={w:S.week,b:{...a.attrs},up:[],nT:0};
  a.weeks=(a.weeks||0)+1;if(a.weeks>=3){const m=revealGift(a,'nos treinos');if(m){a.wk.rev=m;toast(`<b>${m}</b>`)}}
  a.fatigue=Math.max(0,a.fatigue-15);
  a.tlog=a.tlog||[];
  if(a.injury>0){a.wk.rest='inj';a.fatigue=Math.max(0,a.fatigue-20)}
  else if(a.recovery>0){a.wk.rest='rec';a.fatigue=Math.max(0,a.fatigue-20)}
}
function sessionStep(){
  const i=S.wstep||0,cards=[];if(i>=3)return cards;
  for(const a of S.roster){
    if(!a.wk||a.wk.w!==S.week)beginWeek(a);
    const k=a.wk;if(k.rest||k.inj)continue;
    const p=weekPlan(a)[i],id=trainOK(a,p)?p:'corrida',t=TR[id];
    if(id==='descanso'){k.rested=true;a.fatigue=Math.max(0,a.fatigue+t.f);a.conf=clamp(a.conf+3,0,100);toast(`<b>${a.nick}</b> · Descanso`);continue}
    k.nT++;
    if(a.fatigue>70&&Math.random()<(a.fatigue-65)/90){k.inj=true;a.injury=RI(1,3);note(`${a.nick} lesionou-se no treino.`);cards.push(injuryCard(a));continue}
    const b0={...a.attrs},n0=k.up.length,pf=a.padF,l0=pf?a.skills[pf]||0:0;
    const q=clamp(sessQ(a)+R(-.1,.1),.3,1.15); // qualidade da sessão (9.1): atleta (Disciplina, Concentração, confiança) e equipa técnica
    const m=(id==='sparring'&&S.up.ringue)?1.25:1;
    for(const[x,b]of Object.entries(t.g))gain(a,x,b,q,m);
    if(t.sty)addStyleXP(a,t.sty,Math.round(4*q),k.up,true);
    if(id==='sparring')addStyleXP(a,a.style,Math.max(1,Math.round(1.4*q*m)),k.up,false);
    trainSkills(a,id,q*m,k.up);
    a.fatigue=clamp(a.fatigue+(t.f>0?t.f*fatMul(a):t.f),0,100);
    k.up.push(...checkUnlocks(a).map(g=>'aprendeu '+g));
    const g=ATTRS.filter(([x])=>a.attrs[x]-b0[x]>=.05).map(([x])=>'+'+SHORT[x]);
    toast(`<b>${a.nick}</b> · ${t.n} ✓ ${g.join(' ')}${k.up.length>n0?` · <span class="good">${k.up.slice(n0).join(', ')}</span>`:''}`);
    if(id==='pads'&&pf&&(a.skills[pf]||0)>l0&&(l0===0||a.skills[pf]>=5))cards.push(padCard(a,pf,l0===0));
  }
  S.wstep=i+1;return cards;
}
/* ---- fecho da semana: uma só vez por semana, depois dos 3 treinos. Devolve as propostas novas (para os cartões). ---- */
function weekEnd(){
  while((S.wstep||0)<3)sessionStep();
  const lines=[],short=[],reveals=[];
  for(const a of S.roster){
    if(!a.wk||a.wk.w!==S.week)beginWeek(a);
    const k=a.wk;delete a.wk;if(a.ovr&&a.ovr.w<=S.week)delete a.ovr;
    if(a.wcd)for(const x of Object.keys(a.wcd))if(a.wcd[x]<=S.week)delete a.wcd[x];
    if(k.rev)reveals.push(k.rev);
    if(k.rest==='inj'){a.tlog.push({n:0,rest:true});lines.push(`<b>${a.nick}</b> esteve a recuperar da lesão.`);short.push(`${a.nick}: lesionado`);continue}
    if(k.rest==='rec'){a.tlog.push({n:0,rest:true});a.recovery--;lines.push(`<b>${a.nick}</b> descansou depois da luta. ${a.recovery?`Faltam ${a.recovery} semana${a.recovery>1?'s':''} de recuperação.`:'Já pode voltar a treinar.'}`);short.push(`${a.nick}: ${a.recovery?'a recuperar da luta':'pronto para treinar'}`);continue}

    if(k.inj){lines.push(`<b>${a.nick}</b> <span class="warn">lesionou-se por excesso de treino (${a.injury} sem.).</span> ${parts.join(', ')}`);short.push(`${a.nick}: <span class="warn">lesionou-se</span>`)}
    else{lines.push(`<b>${a.nick}</b>: ${parts.join(', ')||'semana leve'} · fadiga ${Math.round(a.fatigue)}`);short.push(`${a.nick}: ${parts.join(', ')||'semana leve'}`)}
  }
  for(const a of S.roster){
    a.tlog=(a.tlog||[]).slice(-6);a.base=a.base||{...a.attrs};a.peak=a.peak||{...a.attrs};a.lastT=a.lastT||{};
    const lost=[];
    for(const k of DECAY_K){
      if(a.lastT[k]===undefined)a.lastT[k]=S.week;
      if(S.week-a.lastT[k]>3){const floor=Math.max(a.base[k],a.peak[k]*TUNE.decayFloor);if(a.attrs[k]>floor){const d=Math.min(TUNE.decay,a.attrs[k]-floor);a.attrs[k]-=d;if(d>.05)lost.push(SHORT[k])}}
    }
    if(lost.length){lines.push(`<b>${a.nick}</b> <span class="warn">está a perder condição física (${lost.join(', ')}) por falta de treino.</span>`);short.push(`<span class="warn">${a.nick} perde ${lost.join(', ')}</span>`)}
    a.conf=clamp(a.conf+(confBase(a)-a.conf)*TUNE.confDrift,0,100);
    if(a.bw==null)a.bw=RI(0,51);
    if(S.week%52===a.bw){a.age++;const qd=a.age>=TUNE.qxAge?TUNE.qxYear*(a.age-TUNE.qxAge+1):0;
      if(qd){a.attrs.queixo=Math.max(5,a.attrs.queixo-qd);a.cap.queixo=Math.max(5,(a.cap.queixo||a.attrs.queixo)-qd)}
      lines.push(`<b>${a.nick}</b> fez ${a.age} anos.${qd?' <span class="warn">Já não aguenta os golpes como antes.</span>':''}`);note(`${a.nick} fez ${a.age} anos.`);short.push(`${a.nick} fez ${a.age} anos`)}
  }
  const fees=S.members*ECON.fee,spons=sponsors(),WC=weeklyCosts(),net=fees+spons-WC.total;
  S.money=Math.max(0,S.money+net);
  const prevM=S.members,cap=capacity();
  const target=Math.min(cap,3+Math.floor(S.pop/3)+eqUnits()+(S.up.pintura?2:0));
  if(S.members<target)S.members+=Math.min(2,target-S.members);else if(S.members>target)S.members--;
  let extra='';
  if(!S.up.pintura&&S.members>8&&Math.random()<.4){S.members--;extra='Um sócio saiu a queixar-se do estado das paredes.'}
  for(const r of S.rivals)if(Math.random()<.15&&r.lvl<8)r.lvl+=1;
  S.pop=Math.min(100,S.pop);
  S.week++;S.wt=0;S.wstep=0;
  const news=[...reveals],newOff=[];
  for(const a of S.roster){
    if(a.injury>0)a.injury--;
    a.offers=a.offers.filter(o=>o.expires>=S.week);
    const had=new Set(a.offers);
    if(!a.fight&&a.rank<=3&&!a.offers.some(o=>o.title)){if(a.offers.length>=3)a.offers.shift();addOffer(a);news.push(`${a.nick} é desafiante oficial: tem uma proposta para lutar pelo título ${TIERS[a.tier].n}!`)}
    else if(!a.fight&&Math.random()<.3+S.pop/200){const n=a.offers.length;addOffer(a);if(a.offers.length>n)news.push(`Nova proposta para ${a.nick}.`)}
    for(const o of a.offers)if(!had.has(o))newOff.push([a,o]);
  }
  note(`Semana fechada: ${net>=0?'+':''}${net} €.`);
  const dm=S.members-prevM;
  SFX.play(net>=0?'coin':'week');
  // relatório completo: fica guardado para ver quando se quiser (Ginásio → RELATÓRIO)
  S.rep={w:S.week-1,html:`<div class="rep">
    <div class="r"><div><strong>TREINOS</strong>${lines.map(l=>`<p>${l}</p>`).join('')}</div></div>
    <div class="r"><div><strong>CONTAS · SALDO ${net>=0?'+':''}${fmt(net)} €</strong><p>Mensalidades <span class="good">+${fees} €</span>${spons?` · Patrocínios <span class="good">+${spons} €</span>`:''}</p><p>Salários <span class="warn">-${WC.sal} €</span>${WC.staff?` · Staff <span class="warn">-${WC.staff} €</span>`:''} · Renda <span class="warn">-${WC.rent} €</span> · Manutenção <span class="warn">-${WC.maint} €</span></p><p>Sócios ${dm>=0?'+':''}${dm} (agora ${S.members}/${capacity()})${extra?' · '+extra:''}</p></div></div>
    ${news.length?`<div class="r"><div><strong>NOVIDADES</strong>${news.map(l=>`<p>${l}</p>`).join('')}</div></div>`:''}
  </div>`};
  // aviso curto (1 a 3 linhas) que não pára o tempo
  const l3=[...news,extra].filter(Boolean);
  toast(`<div><b>SEMANA ${S.week-1}</b> · <span class="${net>=0?'good':'warn'}">${net>=0?'+':''}${fmt(net)} €</span>${dm?` · sócios ${dm>0?'+':''}${dm}`:''}</div><div>${short.join(' · ')}</div>${l3.length?`<div style="color:var(--gold)">${l3.join(' ')}</div>`:''}`,'wk',TIME.noticeMs);

async function endWeek(quiet){
  const newOff=weekEnd();render();
  for(const a of [...S.roster])if(a.pendingRaise)await negotiate(a);
  const empty=CATS.filter(c=>!S.roster.some(a=>a.cat===c));
  if(empty.length&&S.week>3&&Math.random()<.14+S.pop/400)await talent(pick(empty));
  else if(S.week>3&&Math.random()<.05+S.pop/800)await talent(pick(CATS.filter(c=>!empty.includes(c))));
  if(!quiet&&TIME.offerCard)await runCards(newOff.filter(([a,o])=>S.roster.includes(a)&&a.offers.includes(o)).map(([a,o])=>offerCard(a,o)));

/* ---- botão do dia de luta; fora disso fecha a semana inteira de uma vez (para testes: window.__week()) ---- */
async function advanceWeek(){
  if(busy)return;
  if(anyFightNow()){
    busy=true;render();
    for(const a of S.roster){
      if(!(a.fight&&a.fight.week===S.week))continue;
      if(a.injury>0){await info('LUTA CANCELADA',`<p class="hint">${a.nick} está lesionado. A luta com ${a.fight.opp.nick} foi cancelada. Popularidade -2.</p>`);note(`Luta de ${a.nick} cancelada por lesão.`);a.fight=null;S.pop=Math.max(0,S.pop-2);continue}

window.__week=()=>advanceWeek();
window.__clock=()=>S&&{week:S.week,wt:S.wt||0,step:S.wstep||0,run:!!S.run,spd:S.spd||1,busy};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&S.run){S.run=false;save();drawClock()}});
/* ---- golpes e defesas no treino (tema 1.6 e 3): os Pads dão muita experiência ao golpe da semana (a.padF; pode ser um golpe que ainda não sabe,
   se os atributos deixarem: aprende-o em algumas sessões); sem golpe escolhido, espalha pelos que sabe. Os outros treinos dão um pouco aos golpes
   ligados (Guia); o Sparring aos mais usados nas lutas (a.use), a várias defesas e mexe na confiança (sucessos e falhanços). ---- */
const T_SK={saco:['direto','ganchoT','overhand'],pera:['jab'],shadow:PKEYS};
const T_DF={esquiva:{cabeca:5},shadow:{cabeca:1,pes:1},corda:{pes:1.5},pads:{aparar:1},bola:{bloqueio:1}};
/* ---- velocidade de aprender (tema 9.1, passo A4): vale para golpes, defesas, atributos e estilos.
   Treinador: o adjunto (S.up.treinador) e cada especialista de estilo; o especialista ensina mais depressa os golpes e defesas do seu estilo (STY_TEACH).
   Atleta: Disciplina, Concentração e confiança do dia (qualidade da sessão, sessQ: entra nos atributos, estilos, golpes e defesas), Técnica num
   golpe ou defesa novos e fadiga da semana (learnK). Nos Pads, "aprende em ~N sessões" é a estimativa deste atleta (padSess). ---- */
const SPEC={cIn:'In-fighter',cOut:'Outboxer',cPun:'Puncher'};
const STY_TEACH={'In-fighter':['ganchoF','ganchoT','upperF','upperT','cabeca','bloqueio','clinch'],'Outboxer':['jab','direto','pes','aparar'],'Puncher':['direto','ganchoT','overhand','bloqueio','ombro']};
function nSpec(){return Object.keys(SPEC).filter(u=>S.up[u]).length}
function specOf(k){return Object.keys(SPEC).filter(u=>S.up[u]&&STY_TEACH[SPEC[u]].includes(k)).map(u=>SPEC[u])}
function sessQ(a){return clamp(.58+TUNE.confQ*(a.conf??50)+(S.up.treinador?.05:0)+TUNE.discQ*(mv(a,'disc')-50)/50+TUNE.concQ*(mv(a,'conc')-50)/50+TUNE.staffQ*nSpec(),.35,1.1)}
function tecK(a){return clamp(1+TUNE.lTec*((a.attrs.tecnica||0)-TUNE.lTec0),TUNE.lTecMin,TUNE.lTecMax)}
function learnK(a,k,fat){ // por habilidade: equipa técnica, Técnica (só num golpe/defesa novos), fadiga
  return(1+(S.up.treinador?TUNE.lCoach:0)+TUNE.lStaff*nSpec()+(specOf(k).length?TUNE.lSpec:0))*(lvOf(a,k)>0?1:tecK(a))*(1-TUNE.lFat*clamp(fat??a.fatigue??0,0,100)/100)}
function padSess(a,k,plan){ // sessões de Pads (com este golpe como golpe da semana) até aprender / subir de nível
  const lv=a.skills[k]||0,need=(lv?lv*8:TUNE.learnXP)-(a.xp[k]||0),f=plan?(Math.max(0,a.fatigue-15)+projFat(a,plan))/2:a.fatigue;
  return Math.max(1,Math.ceil(need/(TUNE.padXP*sessQ(a)*learnK(a,k,f))))}
function learnWhy(a,k){ // em palavras: o que acelera e o que atrasa (sem números)
  const g=[],b=[],d=mv(a,'disc'),c=mv(a,'conc'),neu=!(lvOf(a,k)>0);
  if(S.up.treinador)g.push('treinador assistente');
  for(const st of k?specOf(k):Object.values(SPEC).filter((s,i)=>S.up[Object.keys(SPEC)[i]]))g.push(`treinador de ${st}${k?'':' (golpes do estilo)'}`);

function scoreRound(){

  {const c=m.ctl+o.ctl;if(c>0){const e=TUNE.ctlJ*(tm+to)*(m.ctl/c-.5);tm+=e;to-=e}} // quem controlou o ringue: pequena vantagem (só decide rounds equilibrados)

function livP(att,def,lv,ctr){ // gancho ao fígado: golpe forte, adversário cansado, trabalho ao corpo antes, curta distância; o Queixo ajuda pouco

  if(F.confetti){if(!F.conf)F.conf=Array.from({length:150},(_,i)=>({x:Math.random()*240,y0:-Math.random()*260,v:.6+Math.random()*1.1,w:2+Math.random()*3,ph:Math.random()*6,c:['#e8b13a','#d4452f','#2d6db3','#f1e5d0','#74b35d','#f5d36a'][i%6]}));
    const el=(now-F.confetti)/1000;for(const q of F.conf){const y=q.y0+el*q.v*55;if(y<-4||y>244)continue;const x=q.x+Math.sin(el*q.w+q.ph)*5;c.fillStyle=q.c;const fl=Math.sin(el*q.w*2+q.ph)>0;c.fillRect(Math.round(x),Math.round(y),fl?3:1,2)}}
  if(F.big){const by=F.bigTop?18:96;c.fillStyle='rgba(0,0,0,.6)';c.fillRect(40,by,160,30);c.fillStyle='#e8b13a';c.font='16px "Press Start 2P", monospace';c.textAlign='center';c.fillText(F.big,120,by+22)}
  drawCaster(now);distBar();
  requestAnimationFrame(ringLoop);
}

/* ================= BOOT ================= */
/* ---- start / pause menu ---- */
function menu(mode){
  return new Promise(res=>{
    const saved=mode==='start'?load():S;const hasSave=!!(saved&&saved.roster);
    const main=()=>{
      const m=modal(`<div class="menu"><div class="mtitle">CORNER MEN</div>
        <div class="mlogo">${logoImg((saved&&saved.logo)||0,40)}</div>
        ${mode==='start'?(hasSave?`<button class="btn gold big" id="mCont">CONTINUAR<small>${(saved.gymName||'Ginásio Esperança')} · semana ${saved.week}</small></button>`:''):`<button class="btn gold big" id="mCont">${mode==='fight'?'VOLTAR À LUTA':'VOLTAR AO JOGO'}</button>`}
        ${mode!=='fight'?`<button class="btn big ${mode==='start'&&!hasSave?'gold':''}" id="mNew">NOVO JOGO</button>`:''}
        <button class="btn" id="mSet">DEFINIÇÕES</button>
        ${mode!=='fight'?'<button class="btn" id="mHelp">COMO JOGAR</button>':''}</div>`);
      const q=id=>m.querySelector(id);
      if(q('#mCont'))q('#mCont').onclick=()=>{$('#modalRoot').innerHTML='';if(S)render();res('cont')};
      if(q('#mNew'))q('#mNew').onclick=()=>{if(!hasSave){$('#modalRoot').innerHTML='';res('new');return}
        const c=modal(`<div class="menu"><h2>COMEÇAR DE NOVO?</h2><p class="hint">Perdes todo o progresso de ${saved.gymName||'este ginásio'}.</p><div class="row2"><button class="btn" id="rNo">CANCELAR</button><button class="btn red" id="rYes">APAGAR E COMEÇAR</button></div></div>`);
        c.querySelector('#rNo').onclick=main;c.querySelector('#rYes').onclick=()=>{$('#modalRoot').innerHTML='';res('new')}};
      q('#mSet').onclick=sett;
      if(q('#mHelp'))q('#mHelp').onclick=async()=>{await help();main()};
    };
    const sett=()=>{
      const m=modal(`<div class="menu"><h2>DEFINIÇÕES</h2>
        <button class="btn big ${SFX.on?'gold':''}" id="mSnd">SOM: ${SFX.on?'LIGADO':'DESLIGADO'}</button>
        <button class="btn" id="mBack">VOLTAR</button></div>`);
      m.querySelector('#mSnd').onclick=()=>{SFX.setOn(!SFX.on);SFX.play('click');sett()};
      m.querySelector('#mBack').onclick=main;
    };
    main();
  });
}
async function pauseMenu(){
  if(F){F.paused=true;const r=await menu('fight');F.paused=false;return r}
  const r=await menu('pause');
  if(r==='new'){ENT=[];occ={};newGame();render();await setupGym();render()}
}

async function start(){
  try{document.fonts&&document.fonts.ready.then(()=>{ARENA=null})}catch(e){}
  {let old=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^corner-men-v\d+$/.test(k)&&k!==KEY)old.push(k)}}catch(e){}
   if(old.length){try{old.forEach(k=>localStorage.removeItem(k))}catch(e){}
     await info('NOVA VERSÃO',`<p class="hint">O Corner Men tem regras novas: atletas com 8 atributos (agora também Queixo, Pés e Ring IQ) e uma personalidade própria.</p><p class="hint">Por isso o jogo recomeça do zero. O teu ginásio antigo não passa para esta versão.</p>`,'COMEÇAR')}}
  const choice=await menu('start');
  S=choice==='new'?null:load();
  let fresh=false;if(!S||!S.roster){newGame();fresh=true}
  S.gymName=S.gymName||'Ginásio Esperança';S.logo=S.logo||0;
  for(const a of S.roster){migrateHist(a);migrateStyles(a);initBody(a,2);if(a.fight){migrateStyles(a.fight.opp);initBody(a.fight.opp,clamp(a.tier+1,1,5))}for(const o of a.offers||[]){migrateStyles(o.opp);initBody(o.opp,clamp(a.tier+1,1,5))}}
  for(const a of S.roster){normSkills(a);a.combos=a.combos||knownCombos(a).map(c=>c.id);a.recovery=a.recovery||0;a.ment=a.ment||rollMental();for(const[k]of ATTRS){if(a.attrs[k]==null)a.attrs[k]=k==='queixo'?50:10;if(a.cap[k]==null)a.cap[k]=a.attrs[k]+5}if(a.gift===undefined){a.gift=null;a.giftKnown=true}a.weeks=a.weeks||0}
  S.tab=S.tab||'gym';
  S.run=false;S.spd=TIME.speeds.includes(S.spd)?S.spd:1;S.wt=clamp(+S.wt||0,0,1);S.wstep=clamp(S.wstep|0,0,3);for(const a of S.roster)delete a.revWeek; // relógio: começa sempre parado
  render();requestAnimationFrame(world);clkLast=performance.now();setInterval(clockTick,100);
  if(fresh){await setupGym();render()}
  if(!S.seen){S.seen=true;save();await help()}
}
start();
})();
